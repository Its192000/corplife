/* =========================================================
   HELPERS
   ========================================================= */
const rand = n => Math.floor(Math.random()*n);
const pick = a => a[rand(a.length)];
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]} return b; };
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null || v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='disabled') e.disabled=!!v;
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const deptOf = id => DEPTS.find(d=>d.id===id);
function toast(text){
  const t=h('div',{class:'toast'},text); $('toasts').append(t);
  setTimeout(()=>t.remove(), 3200);
}

/* =========================================================
   STATE (lưu localStorage)
   ========================================================= */
function freshState(keep){
  return {
    v:1, level:0, days:0, lastCounted:null,
    coins:0, earned:0, energy:MAX_ENERGY, lives:MAX_LIVES,
    levelStartCoins:0, flags:{},
    day:{ date:null, tasks:[], done:{}, sabotage:false, acts:{}, bought:0, alerts:{} },
    dateOffset: keep ? keep.dateOffset : 0,
    seenIntro: keep ? keep.seenIntro : false,
  };
}
let S;
let memoryStore = null;
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const s=JSON.parse(raw); if(s && s.v===1) return s; } }
  catch(e){ if(memoryStore) return memoryStore; }
  return freshState();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){ memoryStore = JSON.parse(JSON.stringify(S)); }
}

/* ---------- Ngày lịch thực (local, reset 00:00) ---------- */
function todayStr(){
  const d=new Date(Date.now() + (S.dateOffset||0)*86400000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function prettyDate(s){ const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
const levelTasks = lv => TASKS_BY_LEVEL[lv] || [];
const hasContent = lv => levelTasks(lv).length>0;
function pickTasks(){
  const pool=levelTasks(S.level); const n=LEVELS[S.level].tasksPerDay;
  return shuffle(pool).slice(0,n).map(t=>t.id);
}
function taskById(id){ return levelTasks(S.level).find(t=>t.id===id); }

function ensureDay(){
  const t=todayStr();
  if(S.day.date===t) return false;
  const first=!S.day.date;
  S.day={ date:t, tasks:pickTasks(), done:{}, sabotage:false, acts:{}, bought:0, alerts:{} };
  if(!first){
    const before=S.energy;
    S.energy=Math.min(MAX_ENERGY, S.energy+NEW_DAY_ENERGY);
    toast(`A new day begins. After a good sleep, energy +${S.energy-before}.`);
  }
  save();
  return true;
}

/* ---------- Mạng ---------- */
const lifePrice = () => Math.min(15, 10 + 2*S.day.bought);   // 10, 12, 14, 15...
function buyLife(){
  if(S.lives>=MAX_LIVES){ toast(`You already have all ${MAX_LIVES} lives.`); return false; }
  const p=lifePrice();
  if(S.coins<p){ toast(`You need ${p} coins to buy a life. You have ${S.coins}.`); return false; }
  S.coins-=p; S.lives++; S.day.bought++;          // không trừ vào coin tích lũy xét thăng cấp
  save(); render(); toast(`Bought 1 life for ${p} coins.`);
  return true;
}

/* ---------- Thăng cấp ---------- */
function nextLevel(){ return LEVELS[S.level+1]; }
function missingFor(nx){
  const m=[];
  if(S.earned<nx.coins) m.push(`Earned coins: ${S.earned}/${nx.coins}, ${nx.coins-S.earned} more to go.`);
  if(S.energy<nx.energy) m.push(`Energy: ${S.energy}/${nx.energy}, restore ${nx.energy-S.energy} more.`);
  return m;
}
function canPromote(){
  const nx=nextLevel();
  return nx && hasContent(S.level) && S.days>=nx.days && missingFor(nx).length===0;
}

/* =========================================================
   MODAL
   ========================================================= */
function showModal({ title, kicker, body, actions=[{label:'Got it',primary:true}], dismissible=true, wide=false, tone }){
  return new Promise(resolve=>{
    const prevFocus=document.activeElement;
    const ov=h('div',{class:'overlay'});
    const box=h('div',{class:'modal'+(wide?' wide':'')+(tone?' tone-'+tone:''),role:'dialog','aria-modal':'true'});
    let closed=false;
    const close=v=>{ if(closed) return; closed=true; ov.remove(); document.removeEventListener('keydown',onKey); if(prevFocus&&prevFocus.focus) prevFocus.focus(); resolve(v); };
    const onKey=e=>{ if(e.key==='Escape' && dismissible) close(); };
    if(kicker) box.append(h('div',{class:'kicker'},kicker));
    if(title) box.append(h('h2',{},title));
    const content=h('div',{});
    box.append(content);
    if(typeof body==='string') content.innerHTML=body;
    else if(typeof body==='function') body(content, close, box);
    if(actions && actions.length){
      const row=h('div',{class:'actions'});
      actions.forEach(a=>row.append(h('button',{type:'button',class:'btn'+(a.primary?' primary':'')+(a.danger?' danger':''),disabled:a.disabled,onclick:()=>close(a.value)},a.label)));
      box.append(row);
    }
    ov.append(box);
    if(dismissible) ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
    document.addEventListener('keydown',onKey);
    document.body.append(ov);
    const f=box.querySelector('button:not([disabled])'); if(f) f.focus();
  });
}

/* =========================================================
   GAME FLOW
   ========================================================= */
let busy=false;

async function startTask(id){
  if(busy) return;
  const t=taskById(id); if(!t || S.day.done[id]==='ok') return;
  const cost=COST[t.diff];
  if(S.energy<cost){
    await showModal({ title:'Out of energy', body:`<p>This task needs ${cost} energy and you only have ${S.energy}. Take a break, grab a coffee or play some sports, then come back.</p>` });
    return;
  }
  busy=true;
  try{
    S.energy-=cost; save(); render();
    await focusRoom(t.dept);
    const res=await playMinigame(t);
    clearRoomFocus();
    if(res && res.win) await onWin(t); else await onFail(t, res ? res.reason : 'The task wasn’t finished.');
  } finally { busy=false; render(); }
}

async function onWin(t){
  S.day.done[t.id]='ok';
  const r=REWARD[t.diff]; S.coins+=r; S.earned+=r;
  let dayLine='';
  const d=todayStr();
  if(S.lastCounted!==d){ S.days++; S.lastCounted=d; dayLine=`<p class="note">Workday ${S.days} has been logged.</p>`; }
  save(); render();
  await showModal({ tone:'ok', kicker:`${deptOf(t.dept).name} team`, title:'Done!', body:`<p class="big">+${r} coins</p>${dayLine}`, actions:[{label:'Continue',primary:true}] });
  if(shouldSabotage()) await runSabotage();
  await checkMilestones();
}

async function onFail(t, reason){
  S.lives=Math.max(0,S.lives-1); save(); render();
  const line=pick(SCOLD[S.level]||SCOLD[0]);
  await showModal({
    tone:'danger', kicker:'Scolding time', title:'The boss wants to see you!', dismissible:false,
    body:`<blockquote>“${line}”</blockquote><p>${reason}</p><p><b>You lose 1 life.</b> ${S.lives>0?`${S.lives} left.`:'You are out of lives.'}</p>`,
    actions:[{label:S.lives>0?'Back to my desk':'Next',primary:true}]
  });
  if(S.lives<=0) return gameOver();
  if(S.lives===2) await lifeReminder();
}

async function lifeReminder(){
  const p=lifePrice();
  const v=await showModal({
    title:'2 lives left', body:`<p>You may want to buy a spare life. Current price: <b>${p} coins</b> (you have ${S.coins}). The price rises with each purchase in a day, up to 15 coins.</p><p class="note">Coins spent on lives are not taken from your earned coins for promotion.</p>`,
    actions:[{label:'Later',value:'no'},{label:`Buy 1 life (${p} coins)`,primary:true,value:'buy',disabled:S.coins<p}]
  });
  if(v==='buy') buyLife();
}

async function gameOver(){
  const v=await showModal({
    tone:'danger', kicker:`All ${MAX_LIVES} lives lost`, title:'You’ve been let go!', dismissible:false,
    body:`<p>The boss wants you to start over. Where would you like to restart?</p>`,
    actions:[{label:'Restart the whole game',value:'game'},{label:`Restart the ${LEVELS[S.level].name} level`,primary:true,value:'level'}]
  });
  if(v==='game'){ S=freshState(S); S.day.date=null; ensureDay(); toast('Starting over as an Intern.'); }
  else restartLevel();
  save(); render();
}
function restartLevel(){
  S.days=0; S.earned=0; S.lives=MAX_LIVES; S.energy=MAX_ENERGY; S.coins=S.levelStartCoins; S.lastCounted=null; S.flags={};
  S.day.tasks=pickTasks(); S.day.done={}; S.day.sabotage=false; S.day.alerts={};
  toast(`Restarting the ${LEVELS[S.level].name} level.`);
}

function shouldSabotage(){
  if(S.day.sabotage) return false;
  const remaining=S.day.tasks.filter(id=>S.day.done[id]!=='ok').length;
  return remaining===0 || Math.random()<SABOTAGE_CHANCE;
}

function runSabotage(){
  S.day.sabotage=true; save();
  const story=pick(SABOTAGE[S.level]||SABOTAGE[0]);
  return showModal({
    kicker:'Unexpected incident (once a day)', title:'Someone set you up!', dismissible:false, actions:[],
    body:(el,close)=>{
      el.append(h('p',{class:'case'},story), h('p',{},'Choose how to react. A coin flip decides which approach works.'));
      const coin=h('div',{class:'coin','aria-hidden':'true'},'🪙');
      const out=h('div',{'aria-live':'polite'});
      const row=h('div',{class:'actions'});
      const choose=side=>{
        row.querySelectorAll('button').forEach(b=>b.disabled=true);
        coin.classList.add('flip');
        const result=Math.random()<0.5?'A':'B';
        const good=result===side;
        setTimeout(()=>{
          coin.textContent=result==='A'?'🗣️':'🤐';
          if(good){ S.energy=Math.min(MAX_ENERGY,S.energy+5); S.coins+=5; S.earned+=5; }
          else { S.energy=Math.max(0,S.energy-5); S.coins=Math.max(0,S.coins-5); S.earned=Math.max(0,S.earned-5); }
          save(); render();
          out.innerHTML = good
            ? `<p><b>Good call!</b> ${pick(SAB_WIN)}</p><p class="note">+5 energy, +5 coins</p>`
            : `<p><b>Wrong call.</b> ${pick(SAB_LOSE)}</p><p class="note">−5 energy, −5 coins</p>`;
          row.innerHTML='';
          const b=h('button',{type:'button',class:'btn primary',onclick:()=>close()},'Back to work');
          row.append(b); b.focus();
        }, reduced?150:1200);
      };
      row.append(
        h('button',{type:'button',class:'btn',onclick:()=>choose('A')},'🗣️ Explain right away'),
        h('button',{type:'button',class:'btn',onclick:()=>choose('B')},'🤐 Stay calm, let it go')
      );
      el.append(coin,out,row);
    }
  });
}

async function checkMilestones(){
  const nx=nextLevel();
  if(!nx || !hasContent(S.level)) return;
  if(S.days===nx.days-1 && !S.flags.pre){
    S.flags.pre=true; save();
    const miss=missingFor(nx);
    await showModal({
      kicker:'Reminder', title:`Tomorrow is your ${nx.name} review`,
      body:`<p>You are on day ${S.days}/${nx.days}. Finish at least 1 task tomorrow to reach the required days.</p>${miss.length?`<p>Other requirements to prepare:</p><ul>${miss.map(m=>`<li>${m}</li>`).join('')}</ul>`:'<p>Your coins and energy are both on track.</p>'}`
    });
  }
  if(S.days>=nx.days){
    const miss=missingFor(nx);
    if(miss.length===0){
      if(!S.day.alerts.ready){
        S.day.alerts.ready=true; save();
        const v=await showModal({ tone:'ok', title:`You qualify for ${nx.name}!`, body:`<p>${nx.days} workdays, ${nx.coins} earned coins and at least ${nx.energy} energy.</p>`, actions:[{label:'Later',value:'later'},{label:'Accept promotion',primary:true,value:'go'}] });
        if(v==='go') await promote();
      }
    } else if(!S.day.alerts.missing){
      S.day.alerts.missing=true; save();
      await showModal({ title:'Enough days, but not quite there', body:`<ul>${miss.map(m=>`<li>${m}</li>`).join('')}</ul><p>Keep working. There is no deadline and no penalty for taking longer.</p>` });
    }
  }
}

async function promote(){
  if(!canPromote()) return;
  const nx=nextLevel();
  S.level++; S.days=0; S.earned=0; S.lives=MAX_LIVES; S.flags={}; S.levelStartCoins=S.coins;
  S.day.tasks=pickTasks(); S.day.done={}; S.day.alerts={};
  save(); render();
  await showModal({
    tone:'ok', kicker:'Promotion letter', title:`Congratulations, you’re now ${nx.name}!`,
    body:`<p>You stay in CTS & Partnership; only your name tag changes to ${nx.name}. Lives refilled to ${MAX_LIVES}.</p>${nx.note?`<p class="sticky-note">${nx.note}</p>`:''}${!hasContent(S.level)?'<p class="note">Tasks for this level are still being built. See you in the next update.</p>':''}`
  });
}

function pickLine(a){ let l; do{ l=pick(a.lines); }while(a.lines.length>1 && l===a._last); a._last=l; return l; }
async function doActivity(id){
  if(busy) return;
  const a=ACTS.find(x=>x.id===id); const used=S.day.acts[id]||0;
  if(used>=a.limit) return;
  if(a.id==='fight'){
    const v=await showModal({ title:'Really start a fight?', body:'<p>Fighting costs 5 energy and gets you nothing.</p>', actions:[{label:'No, stay calm',primary:true,value:'no'},{label:'Go for it anyway',danger:true,value:'yes'}] });
    if(v!=='yes') return;
  }
  if(PANTRY_SPOT[a.id]){ busy=true; try{ await walkToRoom('pantry',PANTRY_SPOT[a.id]); } finally { busy=false; } }
  S.day.acts[id]=used+1;
  S.energy=clamp(S.energy+a.e,0,MAX_ENERGY);
  save(); render();
  toast(`${a.icon} ${pickLine(a)} ${a.e>0?'+':'−'}${Math.abs(a.e)} energy.`);
  if(S.days>=(nextLevel()||{days:Infinity}).days) await checkMilestones();
}

/* ---- lưới đi lại toàn tầng: chặn ô có đồ, tường giữa các phòng chỉ mở ở cửa (ô 3 và 4) ---- */
const inB=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const walkable=(x,y)=>inB(x,y)&&!WORLD.blocked[x][y];
function edgeOpen(x,y,nx,ny){
  if(nx!==x){ const bx=Math.max(x,nx); if(bx%N) return true; const l=y%N; return l===3||l===4; }
  if(ny!==y){ const by=Math.max(y,ny); if(by%N) return true; const l=x%N; return l===3||l===4; }
  return true;
}
function blockFP(g,fp){
  const [x,y,w,d]=fp; const thx=Math.min(.3,w*.9), thy=Math.min(.3,d*.9);
  for(let tx=Math.floor(x);tx<Math.ceil(x+w);tx++) for(let ty=Math.floor(y);ty<Math.ceil(y+d);ty++){
    if(!inB(tx,ty)) continue;
    const ox=Math.min(tx+1,x+w)-Math.max(tx,x), oy=Math.min(ty+1,y+d)-Math.max(ty,y);
    if(ox>thx && oy>thy) g[tx][ty]=true; }
}
function itemBox(fp,h){
  const [x,y,w,d]=fp;
  return [P(G,x,y+d)[0], P(G,x+w,y)[0], P(G,x,y,h)[1], P(G,x+w,y+d)[1]];
}

function buildWorldSVG(){
  let floors='', decals='', walls='', layerItems=[], labels='';
  const blocked=Array.from({length:GW},()=>Array(GH).fill(false));
  const people=[];
  ROOMS.forEach((r,i)=>{
    const o=r.o, [c1,c2,cs]=r.floor||['#86A9C9','#7D9FC0','#6F92B4'];
    let f='';
    for(let x=0;x<N;x++) for(let y=0;y<N;y++) f+=poly([P(o,x,y),P(o,x+1,y),P(o,x+1,y+1),P(o,x,y+1)],(x+y)%2?c1:c2,`stroke="${cs}" stroke-width=".6"`);
    f+=`<polygon class="hl" points="${pts([P(o,0,0),P(o,N,0),P(o,N,N),P(o,0,N)])}" fill="rgba(255,213,74,.22)" stroke="#FFD54A" stroke-width="4"/>`;
    floors+=`<g class="room" id="room-${r.id}">${f}</g>`;
    FURN[r.id](o).forEach(t=>{
      if(t.actor){ people.push({...t, x:t.x+r.rx, y:t.y+r.ry, room:i}); return; }
      if(!t.fp){ if(t.floor) decals+=t.s; else walls+=t.s; return; }
      const fp=[t.fp[0]+r.rx,t.fp[1]+r.ry,t.fp[2],t.fp[3]];
      blockFP(blocked,fp);
      layerItems.push({s:t.s,fp,h:t.h||40});
    });
    const [lx,ly]=P(o,.6,.6,r.row===0?62:24); const lw=Math.round(r.name.length*6.3+22);
    labels+=`<g transform="translate(${lx.toFixed(1)},${ly.toFixed(1)})"><rect x="${-lw/2}" y="-10" width="${lw}" height="19" rx="9.5" fill="${r.color}" stroke="${OUT}" stroke-width=".8"/><text y="3.8" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">${r.name.replace(/&/g,'&amp;')}</text></g>`;
  });
  // vách thấp giữa các phòng (chừa cửa)
  const LOW=18, LC='#E6E1D6', LSK='stroke="#A9A291" stroke-width=".55" stroke-linejoin="round"';
  for(let X=N;X<GW;X+=N) for(let y=0;y<GH;y++){ const l=y%N; if(l===3||l===4) continue; layerItems.push({s:boxS(G,X-.07,y,0,.14,1,LOW,LC,LSK),fp:[X-.07,y,.14,1],h:LOW}); }
  for(let Y=N;Y<GH;Y+=N) for(let x=0;x<GW;x++){ const l=x%N; if(l===3||l===4) continue; layerItems.push({s:boxS(G,x,Y-.07,0,1,.14,LOW,LC,LSK),fp:[x,Y-.07,1,.14],h:LOW}); }
  // cột cửa
  const post=(x,y)=>layerItems.push({s:boxS(G,x-.09,y-.09,0,.18,.18,30,'#CFC8B8',LSK),fp:[x-.09,y-.09,.18,.18],h:30});
  for(let X=N;X<GW;X+=N) for(let r=0;r<ROWS;r++){ post(X,r*N+3); post(X,r*N+5); }
  for(let Y=N;Y<GH;Y+=N) for(let c=0;c<COLS;c++){ post(c*N+3,Y); post(c*N+5,Y); }
  // nền nhà dày + tường ngoài cao (trái và sau), cửa sổ
  let shell=poly([P(G,GW,0),P(G,GW,GH),P(G,GW,GH,-12),P(G,GW,0,-12)],'#55647C')+poly([P(G,0,GH),P(G,GW,GH),P(G,GW,GH,-12),P(G,0,GH,-12)],'#6A7B95');
  shell+=wallL(G,0,GH,0,WH,'#ECE9E1')+wallR(G,0,GW,0,WH,'#DFDBD1');
  for(let r=0;r<ROWS;r++) shell+=wallL(G,r*N,r*N+N,0,7,ROOMS[r*COLS].color)+windowL(G,r*N+.7,r*N+3.8)+windowL(G,r*N+4.2,r*N+7.3);
  for(let c=0;c<COLS;c++) shell+=wallR(G,c*N,c*N+N,0,7,ROOMS[c].color);
  shell+=poly([P(G,0,0,WH),P(G,0,GH,WH),P(G,-.25,GH,WH),P(G,-.25,-.25,WH)],'#BDB8AC')+poly([P(G,0,0,WH),P(G,GW,0,WH),P(G,GW,-.25,WH),P(G,-.25,-.25,WH)],'#C9C4B8');
  shell+=poly([P(G,0,GH,0),P(G,-.25,GH,0),P(G,-.25,GH,WH),P(G,0,GH,WH)],'#CFCABE')+poly([P(G,GW,0,0),P(G,GW,-.25,0),P(G,GW,-.25,WH),P(G,GW,0,WH)],'#CFCABE');
  shell+=wallText(G,GW-4.2,60,'☁ ĐÁM MÂY',16,'#3D6FD9');
  layerItems.sort((a,b)=>(a.fp[0]+a.fp[2]/2+a.fp[1]+a.fp[3]/2)-(b.fp[0]+b.fp[2]/2+b.fp[1]+b.fp[3]/2));
  layerItems.forEach(it=>it.box=itemBox(it.fp,it.h));
  WORLD.blocked=blocked; WORLD.items=layerItems; WORLD.people=people;
  return `<svg width="${SCENE_W}" height="${SCENE_H}" viewBox="0 0 ${SCENE_W} ${SCENE_H}" role="img" aria-label="Đám Mây office floor with ${ROOMS.map(r=>r.name).join(', ')}">`
    +`<g>${shell}${floors}${decals}${walls}<polygon class="marker" points="0,0" fill="rgba(255,255,255,.45)" stroke="#FFD54A" stroke-width="2"/></g>`
    +`<g class="layer">${layerItems.map(it=>`<g>${it.s}</g>`).join('')}</g>`
    +`<g class="labels" pointer-events="none">${labels}</g></svg>`;
}

/* ---- actor ---- */
function makeActor(x,y,look,kind,extra=''){
  const g=document.createElementNS(SVGNS,'g'); g.setAttribute('class','actor');

  a.room=a.homeRoom=roomAt(x,y);
  actors.push(a); placeActor(a); return a;
}
function placeActor(a){
  const [sx,sy]=P(G,a.x,a.y);
  const bob=a.seg?-Math.abs(Math.sin(a.phase*9))*1.8:0;
  a.el.setAttribute('transform',`translate(${sx.toFixed(1)},${(sy+bob).toFixed(1)})`);
}
function reorder(){
  const list=WORLD.items, slots={};
  const acts=actors.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  for(const a of acts){
    const [sx,sy]=P(G,a.x,a.y); let idx=0;
    for(let k=0;k<list.length;k++){ const it=list[k], b=it.box;
      if(b[1]<sx-12||b[0]>sx+12||b[3]<sy-62||b[2]>sy+4) continue;
      const [x,y,w,d]=it.fp; if(a.x>=x+w-.02 || a.y>=y+d-.02) idx=k+1; }
    (slots[idx]=slots[idx]||[]).push(a.el);
  }
  const order=[];
  for(let k=0;k<=list.length;k++){ if(slots[k]) order.push(...slots[k]); if(k<list.length) order.push(list[k].el); }
  const ch=WORLD.layer.childNodes; let same=ch.length===order.length;
  if(same) for(let k=0;k<order.length;k++) if(ch[k]!==order[k]){ same=false; break; }
  if(!same) order.forEach(e=>WORLD.layer.appendChild(e));
}

/* ---- tìm đường ---- */
function bfs(sx,sy,ex,ey){
  if(sx===ex&&sy===ey) return [];
  const key=(x,y)=>x*GH+y, prev=new Map([[key(sx,sy),null]]), q=[[sx,sy]];
  while(q.length){ const [x,y]=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy;
      if(!walkable(nx,ny)||prev.has(key(nx,ny))||!edgeOpen(x,y,nx,ny)) continue;
      prev.set(key(nx,ny),[x,y]);
      if(nx===ex&&ny===ey){ const path=[[nx,ny]]; let c=[x,y]; while(!(c[0]===sx&&c[1]===sy)){ path.unshift(c); c=prev.get(key(c[0],c[1])); } return path; }
      q.push([nx,ny]); } }
  return null;
}
function nearestFree(tx,ty){
  tx=clamp(tx,0,GW-1); ty=clamp(ty,0,GH-1);
  if(walkable(tx,ty)) return [tx,ty];
  const room=roomAt(tx,ty);
  for(let r=1;r<GW;r++) for(let dx=-r;dx<=r;dx++){ const dy=r-Math.abs(dx);
    for(const yy of [ty+dy,ty-dy]){ const xx=tx+dx; if(walkable(xx,yy)&&roomAt(xx,yy)===room) return [xx,yy]; } }
  return [tx,ty];
}
function currentTile(a){
  if(a.seg) return [Math.floor(a.seg.tx),Math.floor(a.seg.ty)];
  return [clamp(Math.floor(a.x),0,GW-1),clamp(Math.floor(a.y),0,GH-1)];
}
function walkTo(a,tx,ty,{maxTime=6}={}){
  a.waiters.splice(0).forEach(r=>r(false));
  const [cx,cy]=currentTile(a); [tx,ty]=nearestFree(tx,ty);
  const p=bfs(cx,cy,tx,ty);
  if(!p) return Promise.resolve(false);
  const wps=p.map(([x,y])=>({x:x+.5,y:y+.5}));
  let len=0, px=a.seg?a.seg.tx:a.x, py=a.seg?a.seg.ty:a.y;
  for(const w of wps){ len+=Math.hypot(w.x-px,w.y-py); px=w.x; py=w.y; }
  a.curSpeed=Math.max(a.speed,len/maxTime);
  a.path=wps;
  return new Promise(r=>a.waiters.push(r));
}
function walkToRoom(id,[lx,ly],opts){ const r=ROOMS[roomIndex(id)]; followCam=true; return Promise.race([walkTo(player,r.rx+lx,r.ry+ly,opts||{maxTime:2.5}),sleep(4500)]); }
function wanderPick(a){
  const taken=new Set();
  actors.forEach(b=>{ if(b===a) return; taken.add(Math.floor(b.x)*GH+Math.floor(b.y));
    const last=b.path[b.path.length-1]; if(last) taken.add(Math.floor(last.x)*GH+Math.floor(last.y)); });
  const [cx,cy]=currentTile(a), [hx,hy]=a.home, cand=[];
  const r=ROOMS[a.homeRoom];
  for(let x=r.rx;x<r.rx+N;x++) for(let y=r.ry;y<r.ry+N;y++)
    if(walkable(x,y) && !taken.has(x*GH+y) && Math.abs(x-hx)+Math.abs(y-hy)<=4 && (x!==cx||y!==cy)) cand.push([x,y]);
  if(!cand.length) return;
  const [x,y]=pick(cand); const p=bfs(cx,cy,x,y);
  if(p && p.length<12){ a.path=p.map(([x,y])=>({x:x+.5,y:y+.5})); a.curSpeed=a.speed; }
}
function updateActor(a,dt){
  if(!a.seg){
    if(a.path.length){ const wp=a.path.shift(); a.seg={fx:a.x,fy:a.y,tx:wp.x,ty:wp.y,t:0,len:Math.max(.001,Math.hypot(wp.x-a.x,wp.y-a.y))}; }
    else {
      if(a.waiters.length) a.waiters.splice(0).forEach(r=>r(true));
      if(a.kind==='wander' && !a.talking){ a.idle-=dt; if(a.idle<=0){ wanderPick(a); a.idle=a.gossip?1+Math.random()*2.5:2+Math.random()*5; } }
      return false;
    }
  }
  const s=a.seg; s.t=Math.min(1,s.t+dt*a.curSpeed/s.len);
  a.x=s.fx+(s.tx-s.fx)*s.t; a.y=s.fy+(s.ty-s.fy)*s.t; a.phase+=dt;
  if(s.t>=1) a.seg=null;
  a.room=roomAt(Math.floor(a.x),Math.floor(a.y));
  placeActor(a);
  return true;
}
function bubbleTick(dt){
  bubbleT-=dt; if(bubbleT>0) return; bubbleT=.7+Math.random()*1.2;
  const g=actors.filter(a=>a.gossip&&!a.bubbleOn); if(!g.length || actors.filter(a=>a.bubbleOn).length>=3) return;
  const a=pick(g), b=a.el.querySelector('.bubble'); if(!b) return;
  let line; do{ line=pick(a.lines||GOSSIP_LINES); }while(line===a.lastLine && (a.lines||GOSSIP_LINES).length>1); a.lastLine=line;
  const w=Math.round(line.length*4.7+16);
  b.querySelector('.bt').textContent=line; const rect=b.querySelector('.bb'); rect.setAttribute('x',-w/2); rect.setAttribute('width',w);
  b.setAttribute('opacity','1'); a.bubbleOn=true;
  setTimeout(()=>{ b.setAttribute('opacity','0'); a.bubbleOn=false; },3000+Math.min(1500,line.length*40));
}
let lastT=0;
function frame(now){
  const dt=lastT?Math.min(.05,(now-lastT)/1000):0; lastT=now;
  let moved=false;
  for(const a of actors) if(updateActor(a,dt)) moved=true;
  if(moved) reorder();
  bubbleTick(dt);
  updateCamera(dt);
  requestAnimationFrame(frame);
}

/* ---- điều khiển người chơi ---- */
function showMarker(x,y){
  const m=WORLD.marker;
  m.setAttribute('points',pts([P(G,x,y),P(G,x+1,y),P(G,x+1,y+1),P(G,x,y+1)]));
  m.classList.add('on'); clearTimeout(m._t); m._t=setTimeout(()=>m.classList.remove('on'),900);
}
function stepPlayer(dx,dy){
  if(player.seg||player.path.length) return;
  const [x,y]=currentTile(player); followCam=true; player.curSpeed=player.speed;
  const ok1=(ax,ay,bx,by)=>walkable(bx,by)&&edgeOpen(ax,ay,bx,by);
  for(const [a,b] of [[dx,dy],[dx,0],[0,dy]].filter(([a,b])=>a||b)){
    const nx=x+a, ny=y+b;
    if(a&&b){ if(!walkable(nx,ny)) continue; if(!((ok1(x,y,x+a,y)&&ok1(x+a,y,nx,ny))||(ok1(x,y,x,y+b)&&ok1(x,y+b,nx,ny)))) continue; }
    else if(!ok1(x,y,nx,ny)) continue;
    player.path=[{x:nx+.5,y:ny+.5}]; return;
  }
}

/* ---- camera + zoom ---- */
let camX=0, camY=0, camDrag=false, camFree=false, baseScale=1, zoom=1, visTop=0, visH=300, viewRoom=roomIndex('partner');
const ZMIN=.35, ZMAX=2.4;
const roomCenter=i=>{ const r=ROOMS[i]; const [sx,sy]=P(G,r.rx+4,r.ry+4); return [sx,sy-38]; };
function updateCamera(dt){
  if(!camDrag){
    let tx,ty;
    if(followCam && player){ const [sx,sy]=P(G,player.x,player.y); tx=sx; ty=sy-34;
      if(viewRoom!==player.room){ viewRoom=player.room; renderRoomBar(); } }
    else if(camFree){ tx=camX; ty=camY; }
    else [tx,ty]=roomCenter(viewRoom);
    const k=Math.min(1,dt*5); camX+=(tx-camX)*k; camY+=(ty-camY)*k;
  }
  applyCam();
}
function applyCam(){
  const svg=$('office').firstElementChild; if(!svg) return;
  svg.style.transform=`translate(${(window.innerWidth/2-camX*SCALE).toFixed(1)}px,${(visTop+visH/2-camY*SCALE).toFixed(1)}px)`;
}
function setScale(){
  const svg=$('office').firstElementChild; if(!svg) return;
  SCALE=baseScale*zoom;
  svg.classList.toggle('far',SCALE<.62);
  svg.setAttribute('width',Math.round(SCENE_W*SCALE)); svg.setAttribute('height',Math.round(SCENE_H*SCALE));
  $('zoomIn').disabled=zoom>=ZMAX-.01; $('zoomOut').disabled=zoom<=ZMIN+.01;
  $('zoomLbl').textContent=Math.round(zoom*100)+'%';
  applyCam();
}
function setZoom(z){ zoom=clamp(z,ZMIN,ZMAX); setScale(); }
function sizeScene(){
  if(!$('office').firstElementChild) return;
  visTop=document.querySelector('.hud').offsetHeight+6;
  visH=Math.max(160,window.innerHeight-visTop-$('sheet').offsetHeight);
  baseScale=clamp(Math.min(visH/270, window.innerWidth/380),.45,2.2);
  $('navPrev').style.top=$('navNext').style.top=(visTop+visH/2-22)+'px';
  setScale();
}
function hitActor(px,py){
  let best=null;
  for(const a of actors){ if(a.kind==='player') continue;
    const [sx,sy]=P(G,a.x,a.y);
    if(px>=sx-13&&px<=sx+13&&py>=sy-57&&py<=sy+5 && (!best||sy>best.sy)) best={a,sy}; }
  return best&&best.a;
}
function tapFloor(cx,cy){
  const r=$('office').firstElementChild.getBoundingClientRect(); const px=(cx-r.left)/SCALE, py=(cy-r.top)/SCALE;
  const who=hitActor(px,py); if(who){ talkTo(who); return; }
  const [x,y]=invP(G,px,py);
  if(x>=0&&y>=0&&x<GW&&y<GH){ const [fx,fy]=nearestFree(Math.floor(x),Math.floor(y)); showMarker(fx,fy); followCam=true; walkTo(player,fx,fy); }
}
function goRoom(i){ viewRoom=clamp(i,0,ROOMS.length-1); followCam=false; camFree=false; renderRoomBar(); }

function buildOffice(){
  const o=$('office');
  o.innerHTML=buildWorldSVG();
  const svg=o.firstElementChild;
  WORLD.layer=svg.querySelector('.layer'); WORLD.marker=svg.querySelector('.marker');
  [...WORLD.layer.children].forEach((el,k)=>WORLD.items[k].el=el);
  WORLD.people.forEach(p=>{
    const r=ROOMS[p.room];
    const label=p.boss?`CEO - ${p.name}`:`${p.name} - ${p.dept||r.short||r.name}`;
    const a=makeActor(p.x,p.y,p.look,p.actor,nameTagSVG(label,p.dept?(ROOMS.find(q=>q.name===p.dept)||r).color:r.color,p.boss)+(p.gossip?BUBBLE_SVG:''));
    Object.assign(a,{name:p.name,dept:p.dept||r.name,boss:!!p.boss,gossip:!!p.gossip,npcId:r.id+':'+p.name,label,look:p.look,lines:p.lines==='boss'?BOSS_BUBBLES:p.lines==='ba'?BA_BUBBLES:GOSSIP_LINES});
    if(p.off){ a.x+=p.off[0]; a.y+=p.off[1]; placeActor(a); }
  });
  const pr=ROOMS[roomIndex('partner')];
  PLAYER_TAG=`<g transform="translate(0,-56)"><rect id="meTagBg" x="-34" y="-10" width="68" height="18" rx="3" fill="#FFD54A" stroke="${OUT}" stroke-width=".8"/>`
    +`<text id="meTag" x="0" y="3.5" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="12" fill="#3A2E00">Intern</text>`
    +`<path d="M-4 8 L0 13 L4 8Z" fill="#FFD54A" stroke="${OUT}" stroke-width=".8"/></g>`;
  player=makeActor(pr.rx+HOME_T[0],pr.ry+HOME_T[1],lookProps(),'player',PLAYER_TAG);
  reorder();
  [camX,camY]=roomCenter(viewRoom); followCam=true;
  sizeScene(); window.addEventListener('resize',sizeScene);
  if(window.ResizeObserver) new ResizeObserver(()=>sizeScene()).observe($('sheet'));

  const ptrs=new Map(); let down=null, pinch=null;
  const pdist=()=>{ const [a,b]=[...ptrs.values()]; return Math.hypot(a.x-b.x,a.y-b.y)||1; };
  const [bx0]=P(G,0,GH), [bx1]=P(G,GW,0), by0=OY-WH, by1=P(G,GW,GH)[1];
  o.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){ if(down&&down.moved) camDrag=false; down=null; o.classList.remove('dragging'); return; }
    if(ptrs.size===1) down={x:e.clientX,y:e.clientY,cx:camX,cy:camY,moved:false};
  });
  window.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2) return;
    if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y;
    if(!down.moved && Math.abs(dx)+Math.abs(dy)>8){ down.moved=true; camDrag=true; followCam=false; o.classList.add('dragging'); }
    if(down.moved){ camX=clamp(down.cx-dx/SCALE,bx0,bx1); camY=clamp(down.cy-dy/SCALE,by0,by1); applyCam(); }
  });
  const endPtr=(e,cancel)=>{
    ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
    if(!down) return; const d=down; down=null; o.classList.remove('dragging');
    if(d.moved){ camDrag=false; camFree=true;
      let best=0,bd=1e9; ROOMS.forEach((_,i)=>{ const [rx,ry]=roomCenter(i); const dd=Math.hypot(rx-camX,ry-camY); if(dd<bd){bd=dd;best=i;} });
      viewRoom=best; renderRoomBar(); return; }
    if(cancel||busy) return; tapFloor(e.clientX,e.clientY);
  };
  window.addEventListener('pointerup',e=>endPtr(e,false));
  window.addEventListener('pointercancel',e=>endPtr(e,true));
  window.addEventListener('keydown',e=>{
    if(busy || document.querySelector('.overlay') || !$('home').hidden) return;
    if(e.target && e.target.closest && e.target.closest('input,textarea,select,button')) return;
    const m={ArrowUp:[-1,-1],ArrowDown:[1,1],ArrowLeft:[-1,1],ArrowRight:[1,-1],w:[-1,-1],s:[1,1],a:[-1,1],d:[1,-1],W:[-1,-1],S:[1,1],A:[-1,1],D:[1,-1]}[e.key];
    if(!m) return; e.preventDefault(); stepPlayer(...m);
  });
  requestAnimationFrame(frame);
}

async function focusRoom(dept){
  const r=$('room-'+dept); if(!r) return;
  document.querySelectorAll('.room.target').forEach(x=>x.classList.remove('target'));
  r.classList.add('target');
  await walkToRoom(dept, dept==='partner'?HOME_T:VISIT_T);
  await sleep(reduced?50:200);
}
function clearRoomFocus(){
  document.querySelectorAll('.room.target').forEach(x=>x.classList.remove('target'));
  if(!player) return;
  const pr=ROOMS[roomIndex('partner')];
  followCam=true; walkTo(player,pr.rx+HOME_T[0],pr.ry+HOME_T[1],{maxTime:3});
}

const TALK_OPTS=[
  {id:'chat',  icon:'💬', label:'Chit-chat',    hint:'+1 to 2 ⚡, luck-based'},
  {id:'work',  icon:'💼', label:'Talk shop',      hint:'+1 to 2 ⚡, luck-based'},
  {id:'gossip',icon:'🤫', label:'Gossip',       hint:'+2 ⚡ or −2 ⚡'},
  {id:'coffee',icon:'☕', label:'Invite for coffee',  hint:'+2 ⚡ if they say yes'},
  {id:'advice',icon:'🙏', label:'Ask for advice',hint:'+1 ⚡ plus a gameplay tip'},
];
const BOSS_OPTS=[
  {id:'report',  icon:'📊', label:'Report your work', hint:'+2 or −2 coins. More tasks done today means better odds'},
  {id:'strategy',icon:'💡', label:'Discuss company plans',hint:'+2 or −2 coins, 50/50'},
  {id:'care',    icon:'🍵', label:'Check in on the boss',      hint:'+2 or −2 coins, usually good'},

const HI=['Oh, the new intern? What’s up?','I’m on a deadline, make it quick.','Hello! How’s your day going?','I was just heading to the pantry. What is it?','Hey, you’re from CTS & Partnership, right? Have a seat.'];
const BOSS_HI=['Andy here. What do you need?','I’m reading reports, so keep it short.','Ah, the CTS & Partnership intern. How’s everything?'];
const BUSY_HI=['You again? Let’s talk tomorrow.','We already talked today. Tomorrow, okay?','I’m focusing. Come back tomorrow!'];
const TIPS=['At 2 lives, buy another one. Don’t be stingy with coins.','When picking a banner, check both the size and the color.','Sports restores the most energy, so save it for review time.','An email saying “waiting for approval” is a follow-up, not a decline.','For the GS docs, take the “final” version, never the draft.','Finish 1 task a day to log the workday. Don’t skip days.','For HR files, check the bank account holder’s name carefully.','Report to the boss after finishing tasks; he praises more.'];
const TALK_TEXT={
  chat:{good:['{n} tells a story about their cat. You can’t stop laughing.','You both love the same TV show and can’t stop talking.','{n} shares half of their snack with you.','{n} shows photos from a trip to Đà Lạt. Refreshing just to look at.'],meh:['{n} is busy and just smiles politely.','{n} nods along but keeps staring at the screen.'],bad:['You chat too loudly and the whole {d} team turns to stare.']},
  work:{good:['{n} shows you a shortcut that saves you so much time.','You settle everything in 5 minutes. A rare miracle.','{n} sends you a template, so no starting from scratch.'],meh:['{n} asks to continue tomorrow because of a deadline.'],bad:['After a while you realize you’re talking about different things. Tiring.']},
  gossip:{good:['You both vent about the “moody” printer. So satisfying.','{n} tells you about someone’s reply-all disaster. Hilarious.','Together you analyze why the Wi-Fi dies during meetings. Total solidarity.'],bad:['The person you’re talking about was right behind you… mortifying.','{n} doesn’t join in and the mood drops.']},
  coffee:{good:['{n} says yes right away and even buys you an iced tea.','You both grab coffee downstairs and come back wide awake.','{n} brings the whole group along. A fun mini coffee break.'],meh:['{n} is already on their third cup and politely declines.']},
  report:{good:['Andy nods: “Clear report, great job.” You get an instant bonus.','Andy praises you in front of everyone. Embarrassing, but nice.'],bad:['Andy asks for the one number you didn’t prepare: “Go do more work and report back.”','Andy shakes his head: “Not enough. Go back and do more.”']},
  strategy:{good:['You share an idea and Andy writes it down, plus a bonus.','Andy lights up: “Good idea, let’s try it.”'],bad:['Andy fires back three questions and you freeze. “Do more research and come back.”','Andy says the idea is half-baked and asks you to bring more data.']},
  care:{good:['Andy says he started as an intern too, and happily gives you milk tea money.','Andy asks if you’re settling in and hands you a box of cookies.'],bad:['Andy is on a call and glances at you: “If you’re that free, go do more work.”']},
  raise:{good:['Andy smiles: “No raise yet, but here’s a bonus.”'],bad:['Andy stares for three seconds: “Are you an Associate yet? Go do more work.”','Andy says it’ll be reviewed at year end. For now, back to work.']},
};
function rollTalk(a,opt){
  const r=Math.random(), T=TALK_TEXT[opt]||{};
  const f=arr=>pick(arr).replace(/\{n\}/g,a.name).replace(/\{d\}/g,a.dept);
  switch(opt){
    case 'chat':   return r<.65?{e:1+rand(2),text:f(T.good)}: r<.9?{e:0,text:f(T.meh)}:{e:-1,text:f(T.bad)};
    case 'work':   return r<.6?{e:1+rand(2),text:f(T.good)}: r<.9?{e:0,text:f(T.meh)}:{e:-1,text:f(T.bad)};
    case 'gossip': return r<.55?{e:2,text:f(T.good)}:{e:-2,text:f(T.bad)};
    case 'coffee': return r<.7?{e:2,text:f(T.good)}:{e:0,text:f(T.meh)};
    case 'advice': return {e:1,text:`${a.name} says: “${pick(TIPS)}”`};
    case 'report': { const done=S.day.tasks.filter(id=>S.day.done[id]==='ok').length; return r<Math.min(.9,.3+.2*done)?{c:2,text:f(T.good)}:{c:-2,text:f(T.bad)}; }
    case 'strategy': return r<.5?{c:2,text:f(T.good)}:{c:-2,text:f(T.bad)};
    case 'care':   return r<.7?{c:2,text:f(T.good)}:{c:-2,text:f(T.bad)};
    case 'raise':  return r<.3?{c:2,text:f(T.good)}:{c:-2,text:f(T.bad)};
  }
  return {e:0,text:'…'};
}
async function talkTo(a){
  if(busy) return; busy=true;
  try{
    a.talking=true; a.path=[];
    const [nx,ny]=currentTile(a), [px,py]=currentTile(player);
    const spots=[[1,0],[0,1],[-1,0],[0,-1]].map(([dx,dy])=>[nx+dx,ny+dy]).filter(([x,y])=>walkable(x,y)&&edgeOpen(nx,ny,x,y));
    spots.sort((p,q)=>Math.hypot(p[0]-px,p[1]-py)-Math.hypot(q[0]-px,q[1]-py));
    const spot=spots[0]||nearestFree(nx,ny);
    followCam=true;
    await Promise.race([walkTo(player,spot[0],spot[1],{maxTime:3}), sleep(5000)]);
    await openTalk(a);
  } finally { a.talking=false; a.idle=1.5+Math.random()*2; busy=false; render(); }
}
function openTalk(a){
  const talked=S.day.talked && S.day.talked[a.npcId];
  const opts=a.boss?BOSS_OPTS:TALK_OPTS;
  return showModal({ kicker:a.boss?'CEO of Đám Mây':`${a.dept} team`, title:a.label, actions:[], body:(el,close)=>{
    el.append(h('div',{class:'talk-head'},
      h('div',{class:'talk-face',html:`<svg viewBox="-17 -44 34 40">${personSVG(0,0,a.look)}</svg>`}),
      h('p',{class:'talk-say'},`“${pick(talked?BUSY_HI:(a.boss?BOSS_HI:HI))}”`)));
    const out=h('div',{'aria-live':'polite'}), grid=h('div',{class:'talk-opts'}), foot=h('div',{class:'actions'});
    const bye=()=>{ const b=h('button',{type:'button',class:'btn primary',onclick:()=>close()},'Goodbye'); foot.innerHTML=''; foot.append(b); b.focus(); };
    if(talked){ el.append(h('p',{class:'note'},`You already talked with ${a.name} today. Come back tomorrow.`),foot); bye(); return; }
    opts.forEach(o=>grid.append(h('button',{type:'button',class:'talk-opt',onclick:()=>{
      const res=rollTalk(a,o.id);
      S.day.talked=S.day.talked||{}; S.day.talked[a.npcId]=true;
      S.energy=clamp(S.energy+(res.e||0),0,MAX_ENERGY);
      if(res.c){ S.coins=Math.max(0,S.coins+res.c); S.earned=Math.max(0,S.earned+res.c); }
      save(); render();
      const fx=[]; if(res.e) fx.push(`${res.e>0?'+':'−'}${Math.abs(res.e)} energy`); if(res.c) fx.push(`${res.c>0?'+':'−'}${Math.abs(res.c)} coins`);
      grid.remove();
      out.append(h('p',{class:'talk-res'},`${o.icon} ${res.text}`), h('p',{class:'note'},fx.length?fx.join(', '):'Nothing changed.'));
      bye();
    }}, h('span',{class:'em','aria-hidden':'true'},o.icon), h('b',{},o.label), h('small',{},o.hint))));
    foot.append(h('button',{type:'button',class:'btn ghost',onclick:()=>close()},'Later'));
    el.append(grid,out,foot);
  }});
}

/* =========================================================
   RENDER (HUD trên, thanh phòng + thẻ chi tiết + lưới ô bên dưới)
   ========================================================= */
let sel={type:'task',id:null};
const ACT_SHORT={coffee:'Coffee',gossip:'Gossip',sport:'Sports',fight:'Fight'};
const ACT_DESC={
  coffee:'Head to the pantry for a drink and a little energy boost.',
  gossip:'Join the pantry crew for office gossip. Mostly for fun, recharges fast.',
  sport:'Get moving on your break. Restores the most energy, but only once a day.',
  fight:'You gain nothing and lose energy. Think twice.',
};

function render(){
  const lv=LEVELS[S.level], nx=nextLevel();
  $('empName').textContent=S.name||'Intern';
  $('lvName').textContent=lv.name;
  if($('meTag')){ const lab=`${S.name||'You'} - ${lv.name}`; $('meTag').textContent=lab; const w=Math.max(60,Math.round(lab.length*6.3+16)); $('meTagBg').setAttribute('x',-w/2); $('meTagBg').setAttribute('width',w); }
  actors.forEach(a=>{ if(!a.npcId) return; const t=a.el.querySelector('.ntag'); if(t) t.setAttribute('opacity',S.day.talked&&S.day.talked[a.npcId]?'.5':'1'); });
  $('dayVal').textContent=nx?`${S.days}/${nx.days}`:String(S.days);
  $('hearts').textContent='❤️'.repeat(S.lives)+'🤍'.repeat(MAX_LIVES-S.lives);
  $('hearts').setAttribute('aria-label',`${S.lives} of ${MAX_LIVES} lives left`);
  $('heartsShort').textContent=`❤️ ${S.lives}/${MAX_LIVES}`;
  $('enVal').textContent=`${S.energy}/${MAX_ENERGY}`;
  $('coinVal').textContent=S.coins;
  $('earnVal').textContent=`earned ${S.earned}`;
  renderRoomBar(); renderSheet();
}

function renderRoomBar(){
  const r=ROOMS[viewRoom], nx=nextLevel();
  $('roombar').style.setProperty('--dc',r.color);
  $('roomName').textContent=r.name;
  const tasks=S.day.tasks.map(taskById).filter(Boolean);
  const here=tasks.filter(t=>t.dept===r.id);
  const done=tasks.filter(t=>S.day.done[t.id]==='ok').length;
  $('roomStats').textContent=r.id==='pantry'?`☕ Hangout spot   ✓ ${done}/${tasks.length} tasks`:r.id==='boss'?`👔 Boss is at the pantry   ✓ ${done}/${tasks.length} tasks`:`📋 ${here.length} here   ✓ ${done}/${tasks.length} tasks`;
  const p=nx?Math.min(1,S.days/nx.days):1;
  $('dayBar').style.width=(p*100)+'%';
  $('dayLbl').textContent=nx?`Progress to ${nx.name}: ${S.days}/${nx.days} days${S.lastCounted===todayStr()?', today counted':''}`:'You are at the top';
  $('navPrev').disabled=viewRoom<=0; $('navNext').disabled=viewRoom>=ROOMS.length-1;
}

function validSel(){
  const tasks=S.day.tasks.filter(id=>taskById(id));
  if(sel.type==='task' && !tasks.includes(sel.id)){
    const firstOpen=tasks.find(id=>S.day.done[id]!=='ok');
    if(firstOpen) sel={type:'task',id:firstOpen};
    else if(tasks.length) sel={type:'task',id:tasks[0]};
    else sel={type:hasContent(S.level)?'act':'soon',id:'coffee'};
  }
}

function renderSheet(){
  validSel();
  const tiles=$('tiles'); tiles.innerHTML='';
  const add=(o)=>{
    const isSel=sel.type===o.type && (sel.id===o.id || o.id==null);
    const b=h('button',{type:'button',class:'tile'+(isSel?' sel':'')+(o.done?' done':''),'aria-pressed':String(isSel),'aria-label':o.aria||o.lbl,style:o.dc?`--dc:${o.dc}`:null,
      onclick:()=>{ sel={type:o.type,id:o.id}; if(o.type==='task'){ const t=taskById(o.id); goRoom(roomIndex(t.dept)); } renderSheet(); }},
      o.dc?h('span',{class:'stripe'}):null, h('span',{class:'em','aria-hidden':'true'},o.em), h('span',{class:'lbl'},o.lbl),
      o.bdg?h('span',{class:'bdg'+(o.bdgCls?' '+o.bdgCls:'')},o.bdg):null);
    tiles.append(b);
  };
  S.day.tasks.forEach(id=>{ const t=taskById(id); if(!t) return; const d=deptOf(t.dept); const done=S.day.done[id]==='ok';
    add({type:'task',id,em:t.icon,lbl:d.name,dc:d.color,done,bdg:done?'✓':`+${REWARD[t.diff]}`,bdgCls:done?'ok':'',aria:`${t.title}, ${d.name} team${done?', done':''}`}); });
  if(!hasContent(S.level)) add({type:'soon',id:'coffee',em:'🚧',lbl:'New tasks'});
  ACTS.forEach(a=>{ const left=a.limit-(S.day.acts[a.id]||0);
    add({type:'act',id:a.id,em:a.icon,lbl:ACT_SHORT[a.id],bdg:a.limit>=99?'∞':String(Math.max(0,left)),bdgCls:left<=0?'off':'',aria:`${a.name}, ${a.limit>=99?'unlimited':`${left} left`}`}); });
  add({type:'promo',id:'promo',em:'🏆',lbl:'Promotion',bdg:canPromote()?'!':null,bdgCls:'ok'});
  add({type:'life',id:'life',em:'❤️',lbl:'Buy life',bdg:String(lifePrice())});
  renderDetail();
}

function detailShell(ic,title,desc,btn,stats){
  const el=$('detail'); el.innerHTML='';
  el.append(h('div',{class:'ic','aria-hidden':'true'},ic), h('div',{},h('h3',{},title),h('p',{},desc)));
  if(btn) el.append(h('button',{type:'button',class:'act-btn',disabled:btn.disabled,onclick:btn.onclick},btn.label,btn.sub?h('small',{},btn.sub):null));
  else el.append(h('span'));
  if(stats) el.append(h('div',{class:'statrow'},...stats.map(x=>h('span',{class:x.ok?'ok':null},x.t||x))));
}

function renderDetail(){
  const nx=nextLevel();
  if(sel.type==='task'){
    const t=taskById(sel.id); const d=deptOf(t.dept); const done=S.day.done[t.id]==='ok'; const cost=COST[t.diff]; const lacking=S.energy<cost;
    detailShell(t.icon,t.title,t.desc,
      {label:done?'Done':lacking?'Too tired':'Start',sub:done?'back tomorrow':`−${cost} ⚡`,disabled:done||lacking||busy,onclick:()=>startTask(t.id)},
      [`🏢 ${d.name}`,`💵 +${REWARD[t.diff]}`,`⚡ −${cost}`,t.diff==='hard'?'🔥 Hard':'🙂 Easy']);
  } else if(sel.type==='act'){
    const a=ACTS.find(x=>x.id===sel.id); const left=a.limit-(S.day.acts[a.id]||0); const full=a.e>0&&S.energy>=MAX_ENERGY;
    detailShell(a.icon,a.name,ACT_DESC[a.id],
      {label:left<=0?'No turns left':full?'Full energy':'Do it',sub:`${a.e>0?'+':'−'}${Math.abs(a.e)} ⚡`,disabled:left<=0||full||busy,onclick:()=>doActivity(a.id)},
      [`⚡ ${a.e>0?'+':'−'}${Math.abs(a.e)}`, a.limit>=99?'Unlimited':`${Math.max(0,left)} left today`,'Doesn’t count as a workday']);
  } else if(sel.type==='promo'){
    if(!nx){ detailShell('🏆','Career peak','You are at the top of the company.',null,null); return; }
    if(!hasContent(S.level)){ detailShell('🏆',`Become ${nx.name}`,`Requirements unlock when ${LEVELS[S.level].name} tasks launch.`,null,null); return; }
    const okD=S.days>=nx.days, okC=S.earned>=nx.coins, okE=S.energy>=nx.energy;
    detailShell('🏆',`Become ${nx.name}`,'Meet all three requirements to get promoted. If you’re short, keep working; there is no late penalty.',
      {label:canPromote()?'Accept promotion':'Not yet',sub:nx.name,disabled:!canPromote()||busy,onclick:()=>promote()},
      [{t:`📅 ${S.days}/${nx.days} days${okD?' ✓':''}`,ok:okD},{t:`💵 ${S.earned}/${nx.coins} coins${okC?' ✓':''}`,ok:okC},{t:`⚡ ${S.energy}/${nx.energy}${okE?' ✓':''}`,ok:okE}]);
  } else if(sel.type==='life'){
    const p=lifePrice();
    detailShell('❤️','Buy extra lives',`Each level gives you ${MAX_LIVES} lives; a mistake costs 1.`+' The price rises with each purchase in a day, up to 15 coins. Coins spent here don’t reduce your earned coins.',
      {label:S.lives>=MAX_LIVES?'Lives full':'Buy 1 life',sub:`${p} coins`,disabled:S.lives>=MAX_LIVES||S.coins<p,onclick:()=>buyLife()},
      [`Lives: ${S.lives}/${MAX_LIVES}`,`💵 You have ${S.coins} coins`]);
  } else {
    detailShell('🚧','Tasks under construction',`${LEVELS[S.level].name} tasks are coming in a later update. You can still explore the office and do side activities.`,null,null);
  }

function playMinigame(t){
  const d=deptOf(t.dept);
  return showModal({
    wide:true, dismissible:false, actions:[],
    kicker:`${d.name} team, ${t.diff==='hard'?'hard':'easy'} task`, title:t.title,
    body:(el,close)=>{
      const tb=h('div',{class:'timer'},h('i')); const tl=h('div',{class:'tlabel'});
      const stage=h('div',{class:'stage'});
      const foot=h('div',{class:'actions'});
      let ended=false, iv=null, left=1, total=1; const cleanups=[];
      const draw=()=>{ const p=Math.max(0,left/total*100); tb.firstChild.style.width=p+'%'; tb.classList.toggle('low',p<30); tl.textContent=`${Math.ceil(Math.max(0,left))} seconds left`; };
      const end=r=>{
        if(ended) return; ended=true; clearInterval(iv); cleanups.forEach(f=>f());
        if(r.win){ stage.append(h('div',{class:'winflash'},'✓ Xong!')); setTimeout(()=>close(r), reduced?200:650); }
        else close(r);
      };
      const ctx={
        win:()=>end({win:true}),
        fail:reason=>end({win:false,reason}),
        onCleanup:f=>cleanups.push(f),
        startTimer(sec){ total=left=sec; draw(); iv=setInterval(()=>{ left-=0.25; draw(); if(left<=0) ctx.fail('Time’s up! The task isn’t done and the clock ran out.'); },250); },
        addTime(s){ left=Math.max(0,left+s); draw(); },
        get ended(){ return ended; },
      };
      foot.append(h('button',{type:'button',class:'btn ghost',onclick:()=>ctx.fail('You quit the task halfway.')},'Give up'));
      el.append(h('div',{class:'trow'},tb,tl), stage, foot);
      MINIGAMES[t.game](stage, ctx);
    }
  });
}

const MINIGAMES = {

  /* 1. Admin/Legal: đi đúng tuyến, giao đúng người */
  route(root, ctx){
    const W=7, H=6, start={x:0,y:H-1};
    const key=(x,y)=>x+','+y;
    const people=shuffle(PEOPLE).slice(0,3); const target=pick(people);
    const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
    let pp=[], obs=new Map();
    const reachAll=()=>{
      const pset=new Set(pp.map(p=>key(p.x,p.y))); const seen=new Set([key(start.x,start.y)]); const q=[start];
      while(q.length){ const c=q.shift(); for(const [dx,dy] of DIRS){ const nx=c.x+dx, ny=c.y+dy, k=key(nx,ny);
        if(nx<0||ny<0||nx>=W||ny>=H||seen.has(k)||obs.has(k)||pset.has(k)) continue; seen.add(k); q.push({x:nx,y:ny}); } }
      return pp.every(p=>DIRS.some(([dx,dy])=>seen.has(key(p.x+dx,p.y+dy))));
    };
    for(let k=0;k<400;k++){
      const cells=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++) cells.push({x,y});
      const far=shuffle(cells.filter(c=>c.x>=3));
      pp=people.map((p,i)=>({...p,x:far[i].x,y:far[i].y}));
      const taken=new Set([key(0,H-1),key(1,H-1),key(0,H-2),...pp.map(p=>key(p.x,p.y))]);
      obs=new Map(); shuffle(cells.filter(c=>!taken.has(key(c.x,c.y)))).slice(0,11).forEach(c=>obs.set(key(c.x,c.y),pick(['🪴','🗄️','🖨️','📦'])));
      if(reachAll()) break;
    }
    let pos={...start};
    const grid=h('div',{class:'rgrid'});
    const draw=()=>{
      grid.innerHTML='';
      for(let y=0;y<H;y++) for(let x=0;x<W;x++){
        const k=key(x,y); const p=pp.find(q=>q.x===x&&q.y===y);
        let cls='cell', kids=[];
        if(x===pos.x&&y===pos.y){ cls+=' me'; kids=['🧑‍💼']; }
        else if(obs.has(k)){ cls+=' obs'; kids=[obs.get(k)]; }
        else if(p){ cls+=' person'; kids=[p.icon,h('small',{},p.name)]; }
        else if(x===start.x&&y===start.y){ kids=[h('small',{},'Door')]; }
        grid.append(h('div',{class:cls,onclick:()=>{ const dx=x-pos.x, dy=y-pos.y; if(Math.abs(dx)+Math.abs(dy)===1) move(dx,dy); }},...kids));
      }
    };
    const move=(dx,dy)=>{
      if(ctx.ended) return;
      const nx=pos.x+dx, ny=pos.y+dy; if(nx<0||ny<0||nx>=W||ny>=H) return;
      if(obs.has(key(nx,ny))) return;
      const p=pp.find(q=>q.x===nx&&q.y===ny);
      if(p){ if(p.name===target.name) ctx.win(); else ctx.fail(`You handed the file to ${p.name} (${p.role}); it needed the ${target.role}.`); return; }
      pos={x:nx,y:ny}; draw();
    };
    const onKey=e=>{
      const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
      if(m){ e.preventDefault(); move(...m); }
    };
    window.addEventListener('keydown',onKey); ctx.onCleanup(()=>window.removeEventListener('keydown',onKey));
    const btn=(lbl,dx,dy,aria)=>h('button',{type:'button','aria-label':aria,onclick:()=>move(dx,dy)},lbl);
    const pad=h('div',{class:'dpad'}, h('span'),btn('↑',0,-1,'Up'),h('span'), btn('←',-1,0,'Left'),btn('↓',0,1,'Down'),btn('→',1,0,'Right'));
    root.append(
      h('div',{class:'msg'},h('div',{class:'who'},'Your CTS & Partnership manager'),h('div',{html:`This sponsorship contract needs the signature of the <b>${target.role}</b>. Walk to their desk and hand it to the right person.`})),
      h('div',{class:'route-wrap'},

        h('div',{}, h('ul',{class:'legend'},...pp.map(p=>h('li',{},`${p.icon} ${p.name}: ${p.role}`))),
          pad, h('p',{class:'lead',style:'margin-top:8px;font-size:12px'},'Use the arrow keys, the buttons or tap a neighboring cell. Walking into someone’s desk hands them the file.'))));
    draw(); ctx.startTimer(30);
  },

  /* 5. Partnership: phân loại inbox */
  inbox(root, ctx){
    const byCat=c=>shuffle(EMAILS.filter(e=>e.cat===c)).slice(0,2);
    const queue=shuffle(CATS.flatMap(c=>byCat(c.id)));
    let i=0, mistakes=0; const wrongs=[];
    const prog=h('div',{class:'progress'}); const card=h('div',{class:'mail'}); const cats=h('div',{class:'cats'});
    const draw=()=>{ const m=queue[i];
      prog.textContent=`Email ${i+1}/${queue.length}. You may get 1 wrong.${mistakes?` Wrong so far: ${mistakes}.`:''}`;
      card.className='mail'; card.innerHTML='';
      card.append(h('div',{class:'from'},`From: ${m.from}`),h('h3',{},m.subj),h('div',{},m.body)); };
    const answer=cid=>{
      if(ctx.ended) return;
      const m=queue[i];
      if(cid!==m.cat){ mistakes++; wrongs.push(m); card.classList.add('flash-bad','shake'); }
      else card.classList.add('flash-ok');
      if(mistakes>=2){ const lbl=c=>CATS.find(x=>x.id===c).label; return ctx.fail(`You misfiled 2 emails. For example, “${wrongs[1].subj}” should be ${lbl(wrongs[1].cat)}.`); }
      setTimeout(()=>{ if(ctx.ended) return; i++; if(i>=queue.length) ctx.win(); else draw(); }, reduced?60:280);
    };
    CATS.forEach((c,n)=>cats.append(h('button',{type:'button',onclick:()=>answer(c.id)},`${n+1}. ${c.label}`,h('small',{},c.hint))));
    const onKey=e=>{ const n=parseInt(e.key,10); if(n>=1&&n<=4){ e.preventDefault(); answer(CATS[n-1].id); } };
    window.addEventListener('keydown',onKey); ctx.onCleanup(()=>window.removeEventListener('keydown',onKey));
    root.append(prog,card,cats); draw(); ctx.startTimer(45);
  },

  /* 6. GS: gom đúng 5 tài liệu trong 60 giây (khó) */
  gather(root, ctx){
    const BASE=['Cross-team meeting agenda','Q1 release schedule','October revenue report','Prospective partner list','Lunar New Year event budget','Gamer survey results','Q1 communication plan','Last week’s meeting minutes'];
    const WRONG=['(draft)','(old 2025)','(not approved)'];
    const FUN=['This week’s lunch menu','Boss’s birthday invitation','How to use the printer','Milk tea order list'];
    const needBase=shuffle(BASE).slice(0,5);
    const need=needBase.map(b=>`${b} (final)`);
    const pileDocs=[...need];
    needBase.forEach(b=>shuffle(WRONG).slice(0,1+rand(2)).forEach(w=>pileDocs.push(`${b} ${w}`)));
    BASE.filter(b=>!needBase.includes(b)).forEach(b=>pileDocs.push(`${b} (final)`));
    FUN.forEach(f=>pileDocs.push(f));
    const docs=shuffle(pileDocs).slice(0,20);
    need.forEach(n=>{ if(!docs.includes(n)) docs[rand(docs.length)]=n; });   // đảm bảo đủ 5 tài liệu cần
    const got=new Set();
    const needList=h('ul',{class:'need'}); const err=h('div',{class:'inline-err','aria-live':'polite'});
    const drawNeed=()=>{ needList.innerHTML=''; need.forEach(n=>needList.append(h('li',{class:got.has(n)?'got':''},n))); };
    const pile=h('div',{class:'pile'});
    docs.forEach(name=>{
      const rot=(Math.random()*10-5).toFixed(1);
      const b=h('button',{type:'button',class:'pdoc',style:`transform:rotate(${rot}deg)`,onclick:()=>{
        if(ctx.ended || got.has(name)) return;
        if(need.includes(name)){ got.add(name); b.classList.add('gone'); drawNeed(); err.textContent=''; if(got.size===need.length) ctx.win(); }
        else { ctx.addTime(-5); err.textContent=`Wrong document: “${name}”. Minus 5 seconds.`; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
      }},'📄 '+name);
      pile.append(b);
    });
    root.append(
      h('div',{class:'msg'},h('div',{class:'who'},'Dũng, GS team'),h('div',{},'The cross-team meeting is about to start! Grab these 5 final documents for me. Picking the wrong one wastes time.')),
      needList, err, pile);
    drawNeed(); ctx.startTimer(60);
  },
};

$('zoomOut').addEventListener('click',()=>setZoom(zoom/1.2));
$('sheetToggle').addEventListener('click',()=>{
  const min=$('sheet').classList.toggle('min');
  $('sheetToggle').textContent=min?'▴':'▾';
  $('sheetToggle').setAttribute('aria-expanded',String(!min));
  $('sheetToggle').setAttribute('aria-label',min?'Expand the control panel':'Collapse the control panel');
  sizeScene();
});

/* ---------- Tủ đồ / Wardrobe ---------- */
const CZ={title:'Wardrobe',open:'✨ Customize your character',gender:'Gender',male:'Male',female:'Female',style:'Hairstyle',short:'Short',long:'Long',bun:'Bun',hair:'Hair color',skin:'Skin tone',shirt:'Top color',bottom:'Pants or skirt',pants:'Pants',skirt:'Skirt',tie:'Tie',yes:'Yes',no:'No',rand:'🎲 Random',done:'Done',chip:'Change your outfit'};
const SWATCH={
  shirt:['#3D6FD9','#D9443F','#2E9C63','#F2C230','#8B6FD6','#F5F5F5','#2B3550','#E07F2E','#F7B6C8'],
  pants:['#2F3A55','#1E1E1E','#6B4532','#5B6683','#C8B48A','#2E5E8C','#7A2E3A'],
  hair:['#2B1B12','#1E1E1E','#6B3B1E','#A7652B','#D9B45A','#B04A3A','#7B4FD0','#A7ADB6'],
  skin:['#F6D7B8','#F1C7A3','#D9A577','#B57A50','#8D5A3B'],
};
function myLook(){ if(!S.look) S.look={gender:'male',style:'short',bottom:'pants',tie:true,shirt:'#3D6FD9',hair:'#2B1B12',skin:'#F1C7A3',pants:'#2F3A55'}; return S.look; }
function lookProps(L=myLook()){ return {shirt:L.shirt,hair:L.hair,skin:L.skin,pants:L.pants,tie:L.tie?'#FFD54A':undefined,long:L.style==='long',bun:L.style==='bun',skirt:L.bottom==='skirt'}; }
const faceSVG=()=>`<svg viewBox="-17 -44 34 40">${personSVG(0,0,lookProps())}</svg>`;
const fullSVG=()=>`<svg viewBox="-16 -46 32 50">${personSVG(0,0,lookProps())}</svg>`;
function applyLook(){
  save();
  const f=faceSVG(); ['empFace','homeLogo','idFace'].forEach(id=>{ if($(id)) $(id).innerHTML=f; });
  if(player){ player.el.innerHTML=personSVG(0,0,lookProps())+PLAYER_TAG; render(); }
}
function buildCustomizer(root){
  const prev=h('div',{class:'cz-prev','aria-hidden':'true'}), ctl=h('div',{});
  root.innerHTML=''; root.append(h('div',{class:'cz'},prev,ctl));
  const L=myLook();
  const change=fn=>{ fn(); applyLook(); draw(); };
  const row=(label,...kids)=>h('div',{class:'cz-row'},h('div',{class:'lb'},label),h('div',{class:'cz-opts'},...kids));
  const seg=(val,cur,label,fn)=>h('button',{type:'button',class:'cz-seg'+(val===cur?' on':''),'aria-pressed':String(val===cur),onclick:()=>change(fn)},label);
  const sws=(key,label)=>row(label,...SWATCH[key].map(c=>h('button',{type:'button',class:'cz-sw'+(L[key]===c?' on':''),style:`background:${c}`,'aria-label':`${label} ${c}`,'aria-pressed':String(L[key]===c),onclick:()=>change(()=>{ L[key]=c; })})));
  function draw(){
    prev.innerHTML=fullSVG(); ctl.innerHTML='';
    ctl.append(
      row(CZ.gender, seg('male',L.gender,CZ.male,()=>{ L.gender='male'; L.style='short'; L.bottom='pants'; L.tie=true; }), seg('female',L.gender,CZ.female,()=>{ L.gender='female'; L.style='long'; L.bottom='skirt'; L.tie=false; })),
      row(CZ.style, ...['short','long','bun'].map(v=>seg(v,L.style,CZ[v],()=>{ L.style=v; }))),
      sws('hair',CZ.hair), sws('skin',CZ.skin), sws('shirt',CZ.shirt),
      row(CZ.bottom, ...['pants','skirt'].map(v=>seg(v,L.bottom,CZ[v],()=>{ L.bottom=v; }))),
      sws('pants',' '),
      row(CZ.tie, seg(true,L.tie,CZ.yes,()=>{ L.tie=true; }), seg(false,L.tie,CZ.no,()=>{ L.tie=false; })),
      h('button',{type:'button',class:'cz-rand',onclick:()=>change(()=>{
        L.gender=pick(['male','female']); L.style=pick(['short','long','bun']); L.bottom=pick(['pants','skirt']); L.tie=Math.random()<.4;
        ['shirt','pants','hair','skin'].forEach(k=>L[k]=pick(SWATCH[k]));
      })},CZ.rand));
  }
  draw();
}
function openWardrobe(){
  if(busy || document.querySelector('.overlay')) return;
  showModal({title:CZ.title, body:el=>buildCustomizer(el), actions:[{label:CZ.done,primary:true}]});
}
$('whoChip').addEventListener('click',openWardrobe);
$('whoChip').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openWardrobe(); } });
$('czBox').querySelector('summary').textContent=CZ.open;
$('whoChip').setAttribute('aria-label',CZ.chip);
buildCustomizer($('czHome'));
applyLook();
showHome();
</script>
<script>
(function(){
  function start(l){
    try{ localStorage.setItem('dammay-lang',l); }catch(e){}
    document.documentElement.lang=l;
    document.title=l==='en'?'Corporate Life — Đám Mây (English)':'Corporate Life — Đám Mây';
    var pick=document.getElementById('langPick'); if(pick) pick.remove();
    document.body.insertAdjacentHTML('beforeend',document.getElementById('body-'+l).innerHTML);
    var s=document.createElement('script'); s.textContent=document.getElementById('js-'+l).textContent; document.body.appendChild(s);
  }
  var saved=null; try{ saved=localStorage.getItem('dammay-lang'); }catch(e){}
  if(saved==='vi'||saved==='en'){ start(saved); return; }
  document.querySelectorAll('#langPick [data-lang]').forEach(function(b){ b.addEventListener('click',function(){ start(b.getAttribute('data-lang')); }); });
})();
</script>
