<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Corporate Life — Đám Mây</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F6; --surface:#FFFFFF; --surface2:#F5F7FB; --ink:#1C2540; --muted:#5B6683; --line:#CBD4E1;
  --cloud:#3D6FD9; --cloud-ink:#FFFFFF; --sticky:#FFD54A; --sticky-ink:#3A2E00; --danger:#D9443F; --ok:#2E9C63; --energy:#F2A22C;
  --d-product:#8B6FD6; --d-marketing:#D95C8E; --d-gs:#22958F; --d-legal:#64738D; --d-hr:#E07F2E; --d-partner:#3D6FD9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121827; --surface:#1B2336; --surface2:#222C42; --ink:#E7ECF5; --muted:#9AA6BF; --line:#33405A;
    --cloud:#7DA0F0; --cloud-ink:#0E1424; --sticky:#E8BE3A; --sticky-ink:#2A2100; --danger:#F06A64; --ok:#4CC387; --energy:#F5B04A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121827; --surface:#1B2336; --surface2:#222C42; --ink:#E7ECF5; --muted:#9AA6BF; --line:#33405A;
  --cloud:#7DA0F0; --cloud-ink:#0E1424; --sticky:#E8BE3A; --sticky-ink:#2A2100; --danger:#F06A64; --ok:#4CC387; --energy:#F5B04A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{font-family:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--sticky);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}

/* ===== Game shell (bố cục kiểu game mobile) ===== */
:root{--g-navy:#1E2740;--g-navy2:#2A3553;--g-cream:#F1E8D2;--g-cream-ink:#3A2F1E;--g-cream-muted:#6B5B40;--g-green:#3FB561;--g-green-d:#2B8A47;--g-orange:#F2A22C}
html,body{height:100%}
body.game-body{overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#64728C 0%,#3A4560 75%);touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:absolute;inset:0;cursor:grab}
.stage.dragging{cursor:grabbing}
.stage svg{position:absolute;left:0;top:0;will-change:transform}
.room .hl{opacity:0;transition:opacity .25s}
.room.target .hl{opacity:1}
.marker{opacity:0;transition:opacity .3s;pointer-events:none}
.marker.on{opacity:1}
.actor{pointer-events:none}
.stage svg.far .ntag,.stage svg.far .bubble{display:none}

.hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none}
.hud-group{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.hud-group.right{align-items:flex-end}
.chip{display:flex;align-items:center;gap:8px;background:rgba(30,39,64,.93);color:#fff;border-radius:10px;padding:6px 8px 6px 10px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;line-height:1.05;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.chip small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-weight:500;font-size:11px;color:#AFC0DE;line-height:1.2}
.chip .em{font-size:18px}
.plus{flex:none;width:26px;height:26px;border-radius:7px;border:0;background:var(--g-orange);color:#3A2400;font:800 17px/1 'Baloo 2',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.plus.blue{background:#5BA9F5;color:#06213F}
.plus.grey{background:#3A4766;color:#fff}
.chip.who{padding:5px 10px 5px 5px}
.chip .face{width:40px;height:40px;border-radius:8px;background:#BFD6EE;overflow:hidden;flex:none}
.chip .face svg{display:block;width:100%;height:100%}
.chip .nm{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl{display:inline-block;margin-top:2px;background:var(--g-orange);color:#3A2400;border-radius:4px;padding:0 6px;font-size:12px}
.hearts{font-size:16px;letter-spacing:1px}
@media (max-width:420px){.chip{font-size:16px;padding:5px 7px 5px 9px}.chip small{display:none}.chip .nm{max-width:90px}.hud{gap:6px}.chip .face{width:34px;height:34px}}

.nav{position:absolute;z-index:4;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:var(--g-navy);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.nav.prev{left:12px}.nav.next{right:12px}
.nav:disabled{opacity:.35;cursor:default}

.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:5;width:min(680px,100%);display:flex;flex-direction:column;gap:8px;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
.roombar{background:var(--g-navy);color:#fff;border-radius:10px;padding:8px 12px 9px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.roombar .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.roombar h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.roombar h2 .dot{width:12px;height:12px;border-radius:3px;background:var(--dc)}
.roombar .rstats{display:flex;gap:10px;background:rgba(0,0,0,.28);border-radius:8px;padding:2px 10px;font:700 14px/1.6 'Baloo 2',sans-serif;white-space:nowrap}
.roombar .prog{height:8px;border-radius:99px;background:rgba(0,0,0,.35);margin-top:6px;overflow:hidden}
.roombar .prog i{display:block;height:100%;background:#5B8FE0;transition:width .3s}
.roombar .proglbl{font-size:11px;color:#AFC0DE;margin-top:3px}
.detail{background:var(--g-cream);color:var(--g-cream-ink);border-radius:12px;padding:10px;display:grid;grid-template-columns:72px 1fr auto;gap:8px 12px;align-items:center;min-height:142px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.detail .ic{width:72px;height:72px;border-radius:10px;background:#FFF9EA;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.detail h3{font-size:19px;font-weight:800}
.detail p{margin:2px 0 0;font-size:13px;line-height:1.38;color:var(--g-cream-muted)}
.act-btn{border:0;border-radius:10px;padding:8px 14px;min-width:126px;background:var(--g-green);color:#fff;font:800 17px/1.1 'Baloo 2',sans-serif;box-shadow:0 3px 0 var(--g-green-d);cursor:pointer}
.act-btn small{display:block;font-size:13px;font-weight:600;opacity:.95}
.act-btn:disabled{background:#B9B2A0;box-shadow:0 3px 0 #8F8977;cursor:not-allowed}
.act-btn:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--g-green-d)}
.statrow{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;background:#2E2A22;color:#fff;border-radius:8px;padding:5px 10px;font:700 14px/1.4 'Baloo 2',sans-serif}
.statrow .ok{color:#7EE09A}
@media (max-width:480px){.detail{grid-template-columns:52px 1fr auto;min-height:0;gap:8px 10px}.detail .ic{width:52px;height:52px;font-size:28px}.detail h3{font-size:16px;line-height:1.15}.detail p{font-size:12px}.act-btn{min-width:88px;padding:7px 10px;font-size:15px}.statrow{font-size:12.5px;gap:2px 12px}.roombar h2{font-size:17px}.roombar .rstats{font-size:12px;padding:1px 8px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.tile{position:relative;height:74px;border:0;border-radius:10px;background:var(--g-navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.tile .em{font-size:28px;line-height:1}
.tile .lbl{font-size:10.5px;line-height:1.15;text-align:center;color:#C9D4EA;font-weight:600}
.tile.sel{background:var(--g-cream);color:var(--g-cream-ink)}
.tile.sel .lbl{color:var(--g-cream-muted)}
.tile.done .em{opacity:.5}
.tile .stripe{position:absolute;left:8px;right:8px;bottom:5px;height:4px;border-radius:2px;background:var(--dc)}
.tile .bdg{position:absolute;right:-4px;top:-5px;min-width:22px;height:20px;padding:0 5px;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.25);background:var(--g-orange);color:#3A2400;font:800 12px/20px 'Baloo 2',sans-serif;text-align:center}
.tile .bdg.ok{background:var(--g-green);color:#fff}
.tile .bdg.off{background:#5A6580;color:#DDE4F2}
@media (max-width:420px){.tile .em{font-size:24px}.tile .lbl{font-size:9.5px}.tiles{gap:6px}}
.empty-note{grid-column:2/-1;font-size:13px;color:var(--g-cream-muted)}

/* ===== Zoom + sheet toggle + mobile ===== */
.zoom{position:absolute;right:12px;z-index:4;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:var(--g-navy);color:#fff;font:800 22px/1 'Baloo 2',sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);touch-action:manipulation}
.zoom button:disabled{opacity:.35;cursor:default}
.zoom .zl{font:700 11px/1 'Be Vietnam Pro',sans-serif;color:#fff;text-align:center;background:rgba(30,39,64,.85);border-radius:6px;padding:3px 0}
.zoomchip{gap:6px;padding:4px 5px;font-size:14px}
.zoomchip #zoomLbl{min-width:40px;text-align:center}
.collapse{flex:none;width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer}
.sheet.min .detail,.sheet.min .tiles{display:none}
.hearts-short{display:none;font-size:16px}
button,.tile,.talk-opt{touch-action:manipulation}
@media (max-width:480px){
  .days-chip{display:none}
  .hearts{display:none}.hearts-short{display:inline}
  .tile{height:62px}.tile .em{font-size:22px}.tile .lbl{font-size:9.5px}
  .roombar{padding:7px 10px 8px}.roombar .proglbl{font-size:10.5px}
  .sheet{gap:6px;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .detail{padding:9px}
  .nav{width:40px;height:40px}
  .zoom button{width:38px;height:38px}
}

/* ===== Wardrobe ===== */
.cz{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.cz-prev{width:96px;height:112px;border-radius:14px;background:#BFD6EE;overflow:hidden;position:sticky;top:0}
.cz-prev svg{display:block;width:100%;height:100%}
.cz-row{margin-bottom:9px}
.cz-row .lb{font-size:12px;font-weight:700;margin-bottom:5px;opacity:.85}
.cz-opts{display:flex;flex-wrap:wrap;gap:6px}
.cz-sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.cz-sw.on{outline:3px solid var(--g-orange);outline-offset:2px}
.cz-seg{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:99px;padding:4px 12px;font:600 12.5px 'Be Vietnam Pro',sans-serif;cursor:pointer;opacity:.75}
.cz-seg.on{background:var(--g-orange);border-color:var(--g-orange);color:#3A2400;opacity:1}
.cz-rand{margin-top:4px;border:0;border-radius:10px;padding:8px 12px;background:#3D6FD9;color:#fff;font:700 13px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.cz-box{background:rgba(255,255,255,.06);border-radius:12px;margin:0 0 14px;padding:0 12px}
.cz-box summary{cursor:pointer;padding:11px 0;font-weight:700;font-size:14px;color:#FFD54A;list-style:none}
.cz-box summary::-webkit-details-marker{display:none}
.cz-box[open]{padding-bottom:12px}
.chip.who{cursor:pointer}
@media (max-width:420px){.cz{grid-template-columns:70px 1fr;gap:10px}.cz-prev{width:70px;height:84px}.cz-sw{width:26px;height:26px}}

/* ===== Talk ===== */
.talk-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.talk-face{width:64px;height:64px;border-radius:12px;background:#BFD6EE;flex:none;overflow:hidden}
.talk-face svg{display:block;width:100%;height:100%}
.talk-say{margin:0!important;font-weight:600;font-size:15px;background:var(--surface2);padding:10px 12px;border-radius:12px 12px 12px 2px;border:1.5px solid var(--line)}
.talk-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.talk-opt{display:grid;grid-template-columns:28px 1fr;column-gap:8px;align-items:center;text-align:left;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.talk-opt .em{grid-row:1/3;font-size:22px}
.talk-opt b{font-size:14px}
.talk-opt small{font-size:11.5px;color:var(--muted);line-height:1.3}
.talk-opt:hover{border-color:var(--ink)}
.talk-res{font-size:16px;font-weight:600}
@media (max-width:420px){.talk-opts{grid-template-columns:1fr}}

/* ===== Home ===== */
.home{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 14px max(16px,env(safe-area-inset-bottom,0px));background:rgba(18,24,42,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.home[hidden]{display:none}
.home-card{width:min(440px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--g-navy);color:#fff;border-radius:20px;padding:22px 18px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .45s ease-out}
.home-top{text-align:center;margin-bottom:14px}
.home-card .logo{width:84px;height:84px;margin:0 auto 6px;border-radius:20px;background:#BFD6EE;border:3px solid #fff;overflow:hidden}
.home-card .logo svg{display:block;width:100%;height:100%}
.home-card h1{font-size:38px;font-weight:800;line-height:1}
.home-card .co{color:#AFC0DE;font-size:14px;margin:6px 0 0}
.welcome{background:rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;color:#DCE4F3}
.welcome p{margin:0 0 8px}.welcome p:last-child{margin:0}
.guide{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:7px}
.guide li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;background:#283357;border-radius:10px;padding:9px 10px}
.guide .gi{font-size:21px;line-height:1.25;text-align:center}
.guide b{display:block;font-size:14px}
.guide .gt{display:block;font-size:12.5px;color:#B9C7E2;line-height:1.42;margin-top:1px}
.controls-note{margin:12px 2px 14px;font-size:12.5px;color:#AFC0DE;text-align:center;line-height:1.45}
.idcard{position:relative;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--g-cream);color:var(--g-cream-ink);border-radius:14px;padding:16px 14px 14px;margin:10px 0 16px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.idcard::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:46px;height:12px;border-radius:6px;background:var(--g-navy);border:3px solid var(--g-cream)}
.idcard .face{width:64px;height:64px;border-radius:10px;background:#BFD6EE;overflow:hidden}
.idcard .face svg{display:block;width:100%;height:100%}
.idcard small{display:block;font-size:11.5px;color:var(--g-cream-muted)}
.idcard .idname{font:800 23px/1.1 'Baloo 2',sans-serif;word-break:break-word;margin:2px 0}
.idcard .idrole{font-size:13px;font-weight:600}
.home-card label{display:block;font-size:13px;font-weight:600;color:#C9D4EA}
.home-card input{width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:2px solid #3A4766;background:#141B2E;color:#fff;font:600 17px 'Be Vietnam Pro',sans-serif}
.home-card input:focus{outline:none;border-color:var(--g-orange)}
.home-card .err{color:#FF9B95;font-size:13px;min-height:20px;margin-top:4px}
.home-card .go{width:100%;margin-top:2px;border:0;border-radius:12px;padding:13px;background:var(--g-green);color:#fff;font:800 19px/1.1 'Baloo 2',sans-serif;box-shadow:0 4px 0 var(--g-green-d);cursor:pointer;touch-action:manipulation}
.home-card .resume{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 12px;font-size:13px;color:#C9D4EA}
.home-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.link-btn{background:none;border:0;color:#AFC0DE;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-top:12px;font-size:13px}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.field{display:block;margin-top:8px}
.field input{width:100%;margin-top:4px;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit}
.field input:focus{border-color:var(--cloud);outline:none}
.dev-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dev-row .btn{font-size:12px;padding:5px 10px;border-width:1.5px}
.btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.primary{background:var(--cloud);border-color:var(--cloud);color:var(--cloud-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(12,17,32,.58);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:20px;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.modal.wide{max-width:780px}
.modal.tone-danger{border-color:var(--danger);box-shadow:6px 6px 0 var(--danger)}
.modal.tone-ok{border-color:var(--ok);box-shadow:6px 6px 0 var(--ok)}
.modal .kicker{color:var(--muted);font-size:13px}
.modal h2{font-size:25px;margin:2px 0 10px}
.modal p{margin:0 0 10px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.modal blockquote{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--danger);background:var(--surface2);border-radius:6px;font-weight:600}
.big{font-family:'Baloo 2',sans-serif;font-size:44px;font-weight:800;color:var(--ok);line-height:1}
.note{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--surface2)}
.sticky-note{background:var(--sticky);color:var(--sticky-ink);padding:10px 14px;border-radius:4px;font-weight:600;transform:rotate(-1deg)}
.modal ul{margin:0 0 10px;padding-left:20px}

/* Minigame shared */
.trow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.timer{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--ok);transition:width .25s linear}
.timer.low i{background:var(--danger)}
.tlabel{font-size:13px;font-weight:600;min-width:88px;text-align:right}
.stage{position:relative}
.winflash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--surface) 85%,transparent);font-family:'Baloo 2',sans-serif;font-size:40px;font-weight:800;color:var(--ok);border-radius:12px}
.msg{background:var(--surface2);border-radius:12px 12px 12px 2px;padding:10px 14px;margin-bottom:12px;border:1.5px solid var(--line)}
.msg .who{font-size:12px;color:var(--muted);font-weight:600}
.inline-err{color:var(--danger);font-size:13px;min-height:20px;margin-top:6px}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* route */
.route-wrap{display:grid;grid-template-columns:1fr 200px;gap:14px;align-items:start}
@media (max-width:620px){.route-wrap{grid-template-columns:1fr}}
.rgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:440px}
.cell{aspect-ratio:1;background:var(--surface2);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(16px,4vw,24px);cursor:pointer;line-height:1}
.cell small{font-size:9px;margin-top:2px;color:var(--muted);white-space:nowrap}
.cell.me{background:var(--sticky);border-color:var(--sticky)}
.cell.person{background:color-mix(in srgb,var(--d-legal) 18%,var(--surface))}
.cell.obs{cursor:default;opacity:.85}
.legend{list-style:none;padding:0;margin:0;font-size:13px}
.legend li{padding:4px 0;border-bottom:1px dashed var(--line)}
.dpad{display:grid;grid-template-columns:repeat(3,44px);gap:4px;margin-top:12px}
.dpad button{height:44px;border-radius:8px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}

/* banner */
.banners{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.banners{grid-template-columns:repeat(2,1fr)}}
.bn-card{height:132px;border:2px solid var(--line);border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer}
.bn-card:hover{border-color:var(--ink)}
.bn{display:flex;flex-direction:column;justify-content:space-between;padding:6px;border-radius:4px;color:#fff;font-weight:700;font-size:11px;line-height:1.2;overflow:hidden}
.bn.wide{width:100%;aspect-ratio:16/9}
.bn.square{height:100%;aspect-ratio:1/1}
.bn.tall{height:100%;aspect-ratio:9/16;font-size:9px}
.bn .logo{align-self:flex-end;background:rgba(255,255,255,.9);color:#1C2540;border-radius:3px;padding:1px 4px;font-size:9px}

/* data */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.chip.sel{background:var(--sticky);color:var(--sticky-ink);border-color:var(--sticky)}
.chip.used{opacity:.35}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable td{padding:6px 4px;border-bottom:1px solid var(--line)}
.rtable button{width:100%;min-height:38px;border:2px dashed var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font-weight:700;cursor:pointer}
.rtable button.filled{border-style:solid;border-color:var(--cloud)}

/* hr */
.hr-wrap{display:grid;grid-template-columns:200px 1fr;gap:14px}
@media (max-width:620px){.hr-wrap{grid-template-columns:1fr}}
.checklist{list-style:none;margin:0;padding:12px;background:var(--sticky);color:var(--sticky-ink);border-radius:4px;font-size:13px}
.checklist li{padding:3px 0}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.doc{text-align:left;border:2px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);padding:8px 10px;cursor:pointer}
.doc b{display:block;font-size:14px}
.doc span{font-size:12px;color:var(--muted)}
.doc.sel{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}

/* inbox */
.mail{border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2);min-height:120px}
.mail .from{font-size:12px;color:var(--muted)}
.mail h3{font-size:17px;margin:2px 0 6px}
.mail.flash-ok{border-color:var(--ok)} .mail.flash-bad{border-color:var(--danger)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,1fr)}}
.cats button{padding:10px 6px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.cats button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.progress{font-size:13px;color:var(--muted);margin-bottom:8px}

/* gather */
.need{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.need li{font-size:13px;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line)}
.need li.got{background:var(--ok);border-color:var(--ok);color:#fff;text-decoration:line-through}
.pile{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:var(--surface2);border-radius:12px;border:1.5px solid var(--line)}
.pdoc{width:132px;min-height:66px;padding:8px;font-size:12px;font-weight:600;text-align:left;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.pdoc.gone{visibility:hidden}

/* sabotage */
.case{font-size:17px;font-weight:600;padding:12px 14px;background:var(--surface2);border-radius:10px;border-left:5px solid var(--d-marketing)}
.coin{width:86px;height:86px;border-radius:50%;background:var(--sticky);border:3px solid var(--ink);margin:14px auto;display:flex;align-items:center;justify-content:center;font-size:38px}
.coin.flip{animation:flip 1.2s ease-in-out}
@keyframes flip{to{transform:rotateY(1800deg)}}

.toasts{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(92vw,460px);pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Language picker ===== */
.lang-pill{display:flex;justify-content:flex-end;gap:4px;margin:-6px -4px 4px 0}
.lang-pill button{border:0;border-radius:99px;padding:4px 10px;font:700 12px 'Be Vietnam Pro',sans-serif;background:rgba(255,255,255,.08);color:#C9D4EA;cursor:pointer}
.lang-pill button.on{background:var(--g-orange);color:#3A2400;cursor:default}
.pick-card{width:min(400px,100%);background:var(--g-navy);color:#fff;border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .45s ease-out}
.pick-card .logo{font-size:56px;line-height:1}
.pick-card h1{font-size:38px;font-weight:800;margin:6px 0 2px}
.pick-card p{color:#AFC0DE;font-size:14px;margin:0 0 20px}
.pick-card .go{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;padding:14px;background:var(--g-green);color:#fff;font:800 19px/1.1 'Baloo 2',sans-serif;box-shadow:0 4px 0 var(--g-green-d);cursor:pointer}
.pick-card .go.alt{background:#3D6FD9;box-shadow:0 4px 0 #2A4FA3}
.pick-card .go small{display:block;font:500 12px 'Be Vietnam Pro',sans-serif;opacity:.9;margin-top:3px}
</style>
</head>

const rand = n => Math.floor(Math.random()*n);
const pick = a => a[rand(a.length)];
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]} return b; };
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null || v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='disabled') e.disabled=!!v;
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const deptOf = id => DEPTS.find(d=>d.id===id);
function toast(text){
  const t=h('div',{class:'toast'},text); $('toasts').append(t);
  setTimeout(()=>t.remove(), 3200);
}

/* =========================================================
   STATE (lưu localStorage)
   ========================================================= */
function freshState(keep){
  return {
    v:1, level:0, days:0, lastCounted:null,
    coins:0, earned:0, energy:MAX_ENERGY, lives:MAX_LIVES,
    levelStartCoins:0, flags:{},
    day:{ date:null, tasks:[], done:{}, sabotage:false, acts:{}, bought:0, alerts:{} },
    dateOffset: keep ? keep.dateOffset : 0,
    seenIntro: keep ? keep.seenIntro : false,
  };
}
let S;
let memoryStore = null;
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const s=JSON.parse(raw); if(s && s.v===1) return s; } }
  catch(e){ if(memoryStore) return memoryStore; }
  return freshState();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){ memoryStore = JSON.parse(JSON.stringify(S)); }
}

/* ---------- Ngày lịch thực (local, reset 00:00) ---------- */
function todayStr(){
  const d=new Date(Date.now() + (S.dateOffset||0)*86400000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function prettyDate(s){ const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
const levelTasks = lv => TASKS_BY_LEVEL[lv] || [];
const hasContent = lv => levelTasks(lv).length>0;
function pickTasks(){
  const pool=levelTasks(S.level); const n=LEVELS[S.level].tasksPerDay;
  return shuffle(pool).slice(0,n).map(t=>t.id);
}
function taskById(id){ return levelTasks(S.level).find(t=>t.id===id); }

function ensureDay(){
  const t=todayStr();
  if(S.day.date===t) return false;
  const first=!S.day.date;
  S.day={ date:t, tasks:pickTasks(), done:{}, sabotage:false, acts:{}, bought:0, alerts:{} };
  if(!first){
    const before=S.energy;
    S.energy=Math.min(MAX_ENERGY, S.energy+NEW_DAY_ENERGY);
    toast(`Ngày mới bắt đầu. Ngủ một giấc, năng lượng +${S.energy-before}.`);
  }
  save();
  return true;
}

/* ---------- Mạng ---------- */
const lifePrice = () => Math.min(15, 10 + 2*S.day.bought);   // 10, 12, 14, 15...
function buyLife(){
  if(S.lives>=MAX_LIVES){ toast(`Bạn đang có đủ ${MAX_LIVES} mạng.`); return false; }
  const p=lifePrice();
  if(S.coins<p){ toast(`Cần ${p} coin để mua 1 mạng. Bạn đang có ${S.coins}.`); return false; }
  S.coins-=p; S.lives++; S.day.bought++;          // không trừ vào coin tích lũy xét thăng cấp
  save(); render(); toast(`Đã mua 1 mạng với giá ${p} coin.`);
  return true;
}

/* ---------- Thăng cấp ---------- */
function nextLevel(){ return LEVELS[S.level+1]; }
function missingFor(nx){
  const m=[];
  if(S.earned<nx.coins) m.push(`Coin tích lũy: ${S.earned}/${nx.coins}, còn thiếu ${nx.coins-S.earned} coin.`);
  if(S.energy<nx.energy) m.push(`Năng lượng: ${S.energy}/${nx.energy}, cần hồi thêm ${nx.energy-S.energy}.`);
  return m;
}
function canPromote(){
  const nx=nextLevel();
  return nx && hasContent(S.level) && S.days>=nx.days && missingFor(nx).length===0;
}

/* =========================================================
   MODAL
   ========================================================= */
function showModal({ title, kicker, body, actions=[{label:'Đã hiểu',primary:true}], dismissible=true, wide=false, tone }){
  return new Promise(resolve=>{
    const prevFocus=document.activeElement;
    const ov=h('div',{class:'overlay'});
    const box=h('div',{class:'modal'+(wide?' wide':'')+(tone?' tone-'+tone:''),role:'dialog','aria-modal':'true'});
    let closed=false;
    const close=v=>{ if(closed) return; closed=true; ov.remove(); document.removeEventListener('keydown',onKey); if(prevFocus&&prevFocus.focus) prevFocus.focus(); resolve(v); };
    const onKey=e=>{ if(e.key==='Escape' && dismissible) close(); };
    if(kicker) box.append(h('div',{class:'kicker'},kicker));
    if(title) box.append(h('h2',{},title));
    const content=h('div',{});
    box.append(content);
    if(typeof body==='string') content.innerHTML=body;
    else if(typeof body==='function') body(content, close, box);
    if(actions && actions.length){
      const row=h('div',{class:'actions'});
      actions.forEach(a=>row.append(h('button',{type:'button',class:'btn'+(a.primary?' primary':'')+(a.danger?' danger':''),disabled:a.disabled,onclick:()=>close(a.value)},a.label)));
      box.append(row);
    }
    ov.append(box);
    if(dismissible) ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
    document.addEventListener('keydown',onKey);
    document.body.append(ov);
    const f=box.querySelector('button:not([disabled])'); if(f) f.focus();
  });
}

let busy=false;

async function startTask(id){
  if(busy) return;
  const t=taskById(id); if(!t || S.day.done[id]==='ok') return;
  const cost=COST[t.diff];
  if(S.energy<cost){
    await showModal({ title:'Hết năng lượng', body:`<p>Việc này cần ${cost} năng lượng, bạn chỉ còn ${S.energy}. Ra giờ giải lao uống cà phê hoặc chơi thể thao để hồi sức rồi quay lại.</p>` });
    return;
  }
  busy=true;
  try{
    S.energy-=cost; save(); render();
    await focusRoom(t.dept);
    const res=await playMinigame(t);
    clearRoomFocus();
    if(res && res.win) await onWin(t); else await onFail(t, res ? res.reason : 'Nhiệm vụ chưa hoàn thành.');
  } finally { busy=false; render(); }
}

async function onWin(t){
  S.day.done[t.id]='ok';
  const r=REWARD[t.diff]; S.coins+=r; S.earned+=r;
  let dayLine='';
  const d=todayStr();
  if(S.lastCounted!==d){ S.days++; S.lastCounted=d; dayLine=`<p class="note">Ngày làm việc thứ ${S.days} của bạn đã được ghi nhận.</p>`; }
  save(); render();
  await showModal({ tone:'ok', kicker:`Phòng ${deptOf(t.dept).name}`, title:'Hoàn thành!', body:`<p class="big">+${r} coin</p>${dayLine}`, actions:[{label:'Tiếp tục',primary:true}] });
  if(shouldSabotage()) await runSabotage();
  await checkMilestones();
}

async function onFail(t, reason){
  S.lives=Math.max(0,S.lives-1); save(); render();
  const line=pick(SCOLD[S.level]||SCOLD[0]);
  await showModal({
    tone:'danger', kicker:'Phòng la', title:'Sếp gọi lên phòng!', dismissible:false,
    body:`<blockquote>“${line}”</blockquote><p>${reason}</p><p><b>Bạn mất 1 mạng.</b> ${S.lives>0?`Còn ${S.lives} mạng.`:'Bạn đã hết mạng.'}</p>`,
    actions:[{label:S.lives>0?'Về chỗ ngồi':'Tiếp',primary:true}]
  });
  if(S.lives<=0) return gameOver();
  if(S.lives===2) await lifeReminder();
}

async function lifeReminder(){
  const p=lifePrice();
  const v=await showModal({
    title:'Còn 2 mạng', body:`<p>Bạn nên mua thêm mạng để phòng hờ. Giá hiện tại: <b>${p} coin</b> (bạn có ${S.coins} coin). Giá tăng dần theo số lần mua trong ngày, tối đa 15 coin.</p><p class="note">Coin dùng để mua mạng không bị trừ vào coin tích lũy xét thăng cấp.</p>`,
    actions:[{label:'Để sau',value:'no'},{label:`Mua 1 mạng (${p} coin)`,primary:true,value:'buy',disabled:S.coins<p}]
  });
  if(v==='buy') buyLife();
}

async function gameOver(){
  const v=await showModal({
    tone:'danger', kicker:`Hết ${MAX_LIVES} mạng`, title:'Bạn bị cho nghỉ việc!', dismissible:false,
    body:`<p>Sếp quyết định cho bạn làm lại từ đầu. Bạn muốn bắt đầu lại từ đâu?</p>`,
    actions:[{label:'Chơi lại từ đầu game',value:'game'},{label:`Chơi lại từ đầu cấp ${LEVELS[S.level].name}`,primary:true,value:'level'}]
  });
  if(v==='game'){ S=freshState(S); S.day.date=null; ensureDay(); toast('Bắt đầu lại từ vị trí Intern.'); }
  else restartLevel();
  save(); render();
}
function restartLevel(){
  S.days=0; S.earned=0; S.lives=MAX_LIVES; S.energy=MAX_ENERGY; S.coins=S.levelStartCoins; S.lastCounted=null; S.flags={};
  S.day.tasks=pickTasks(); S.day.done={}; S.day.sabotage=false; S.day.alerts={};
  toast(`Bắt đầu lại cấp ${LEVELS[S.level].name}.`);
}

function shouldSabotage(){
  if(S.day.sabotage) return false;
  const remaining=S.day.tasks.filter(id=>S.day.done[id]!=='ok').length;
  return remaining===0 || Math.random()<SABOTAGE_CHANCE;
}

function runSabotage(){
  S.day.sabotage=true; save();
  const story=pick(SABOTAGE[S.level]||SABOTAGE[0]);
  return showModal({
    kicker:'Sự cố ngoài ý muốn (1 lần mỗi ngày)', title:'Bạn bị hãm hại!', dismissible:false, actions:[],
    body:(el,close)=>{
      el.append(h('p',{class:'case'},story), h('p',{},'Chọn cách phản ứng. Đồng xu sẽ quyết định cách nào hiệu quả.'));
      const coin=h('div',{class:'coin','aria-hidden':'true'},'🪙');
      const out=h('div',{'aria-live':'polite'});
      const row=h('div',{class:'actions'});
      const choose=side=>{
        row.querySelectorAll('button').forEach(b=>b.disabled=true);
        coin.classList.add('flip');
        const result=Math.random()<0.5?'A':'B';
        const good=result===side;
        setTimeout(()=>{
          coin.textContent=result==='A'?'🗣️':'🤐';
          if(good){ S.energy=Math.min(MAX_ENERGY,S.energy+5); S.coins+=5; S.earned+=5; }
          else { S.energy=Math.max(0,S.energy-5); S.coins=Math.max(0,S.coins-5); S.earned=Math.max(0,S.earned-5); }
          save(); render();
          out.innerHTML = good
            ? `<p><b>Chọn đúng!</b> ${pick(SAB_WIN)}</p><p class="note">+5 năng lượng, +5 coin</p>`
            : `<p><b>Chọn sai rồi.</b> ${pick(SAB_LOSE)}</p><p class="note">−5 năng lượng, −5 coin</p>`;
          row.innerHTML='';
          const b=h('button',{type:'button',class:'btn primary',onclick:()=>close()},'Quay lại làm việc');
          row.append(b); b.focus();
        }, reduced?150:1200);
      };
      row.append(
        h('button',{type:'button',class:'btn',onclick:()=>choose('A')},'🗣️ Thanh minh ngay'),
        h('button',{type:'button',class:'btn',onclick:()=>choose('B')},'🤐 Bình tĩnh, cho qua')
      );
      el.append(coin,out,row);
    }
  });
}

async function checkMilestones(){
  const nx=nextLevel();
  if(!nx || !hasContent(S.level)) return;
  if(S.days===nx.days-1 && !S.flags.pre){
    S.flags.pre=true; save();
    const miss=missingFor(nx);
    await showModal({
      kicker:'Nhắc nhở', title:`Ngày mai là mốc xét lên ${nx.name}`,
      body:`<p>Bạn đang ở ngày ${S.days}/${nx.days}. Hoàn thành ít nhất 1 việc vào ngày mai để đủ số ngày.</p>${miss.length?`<p>Những điều kiện khác cần chuẩn bị:</p><ul>${miss.map(m=>`<li>${m}</li>`).join('')}</ul>`:'<p>Coin và năng lượng của bạn đều đang đạt.</p>'}`
    });
  }
  if(S.days>=nx.days){
    const miss=missingFor(nx);
    if(miss.length===0){
      if(!S.day.alerts.ready){
        S.day.alerts.ready=true; save();
        const v=await showModal({ tone:'ok', title:`Bạn đủ điều kiện lên ${nx.name}!`, body:`<p>Đủ ${nx.days} ngày, ${nx.coins} coin tích lũy và tối thiểu ${nx.energy} năng lượng.</p>`, actions:[{label:'Để sau',value:'later'},{label:'Nhận quyết định',primary:true,value:'go'}] });
        if(v==='go') await promote();
      }
    } else if(!S.day.alerts.missing){
      S.day.alerts.missing=true; save();
      await showModal({ title:'Đủ ngày, nhưng còn thiếu', body:`<ul>${miss.map(m=>`<li>${m}</li>`).join('')}</ul><p>Cứ tiếp tục làm việc, không có hạn chót và không bị phạt trễ.</p>` });
    }
  }
}

async function promote(){
  if(!canPromote()) return;
  const nx=nextLevel();
  S.level++; S.days=0; S.earned=0; S.lives=MAX_LIVES; S.flags={}; S.levelStartCoins=S.coins;
  S.day.tasks=pickTasks(); S.day.done={}; S.day.alerts={};
  save(); render();
  await showModal({
    tone:'ok', kicker:'Quyết định bổ nhiệm', title:`Chúc mừng, bạn đã lên ${nx.name}!`,
    body:`<p>Bạn vẫn ngồi ở phòng CTS & Partnership, chỉ có bảng tên đổi thành ${nx.name}. Mạng được hồi đầy ${MAX_LIVES}.</p>${nx.note?`<p class="sticky-note">${nx.note}</p>`:''}${!hasContent(S.level)?'<p class="note">Nhiệm vụ của cấp này đang được xây dựng, hẹn bạn ở bản cập nhật tiếp theo.</p>':''}`
  });
}

function pickLine(a){ let l; do{ l=pick(a.lines); }while(a.lines.length>1 && l===a._last); a._last=l; return l; }
async function doActivity(id){
  if(busy) return;
  const a=ACTS.find(x=>x.id===id); const used=S.day.acts[id]||0;
  if(used>=a.limit) return;
  if(a.id==='fight'){
    const v=await showModal({ title:'Đánh lộn thật hả?', body:'<p>Đánh lộn làm bạn mất 5 năng lượng và không được thêm gì cả.</p>', actions:[{label:'Thôi, bình tĩnh',primary:true,value:'no'},{label:'Vẫn lao vào',danger:true,value:'yes'}] });
    if(v!=='yes') return;
  }
  if(PANTRY_SPOT[a.id]){ busy=true; try{ await walkToRoom('pantry',PANTRY_SPOT[a.id]); } finally { busy=false; } }
  S.day.acts[id]=used+1;
  S.energy=clamp(S.energy+a.e,0,MAX_ENERGY);
  save(); render();
  toast(`${a.icon} ${pickLine(a)} ${a.e>0?'+':'−'}${Math.abs(a.e)} năng lượng.`);
  if(S.days>=(nextLevel()||{days:Infinity}).days) await checkMilestones();
}

const P=(o,x,y,z=0)=>[o.ox+(x-y)*TW/2, o.oy+(x+y)*TH/2-z];

function shade(hex,a){const n=parseInt(hex.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(a<0?v*(1+a):v+(255-v)*a));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');}
function boxS(o,x,y,z,w,d,hh,c,sk=SK){
  return poly([P(o,x,y,z+hh),P(o,x+w,y,z+hh),P(o,x+w,y+d,z+hh),P(o,x,y+d,z+hh)],c,sk)
    +poly([P(o,x,y+d,z),P(o,x+w,y+d,z),P(o,x+w,y+d,z+hh),P(o,x,y+d,z+hh)],shade(c,-.12),sk)
    +poly([P(o,x+w,y,z),P(o,x+w,y+d,z),P(o,x+w,y+d,z+hh),P(o,x+w,y,z+hh)],shade(c,-.25),sk);
}
const faceY=(o,x1,x2,y,z1,z2,c,extra)=>poly([P(o,x1,y,z1),P(o,x2,y,z1),P(o,x2,y,z2),P(o,x1,y,z2)],c,extra);
const wallR=(o,x1,x2,z1,z2,c,extra)=>faceY(o,x1,x2,0,z1,z2,c,extra);
const wallL=(o,y1,y2,z1,z2,c,extra)=>poly([P(o,0,y1,z1),P(o,0,y2,z1),P(o,0,y2,z2),P(o,0,y1,z2)],c,extra);
const floorRect=(o,x,y,w,d,c,extra='')=>poly([P(o,x,y),P(o,x+w,y),P(o,x+w,y+d),P(o,x,y+d)],c,extra);

/* ---- lưới đi lại toàn tầng: chặn ô có đồ, tường giữa các phòng chỉ mở ở cửa (ô 3 và 4) ---- */
const inB=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const walkable=(x,y)=>inB(x,y)&&!WORLD.blocked[x][y];
function edgeOpen(x,y,nx,ny){
  if(nx!==x){ const bx=Math.max(x,nx); if(bx%N) return true; const l=y%N; return l===3||l===4; }
  if(ny!==y){ const by=Math.max(y,ny); if(by%N) return true; const l=x%N; return l===3||l===4; }
  return true;
}
function blockFP(g,fp){
  const [x,y,w,d]=fp; const thx=Math.min(.3,w*.9), thy=Math.min(.3,d*.9);
  for(let tx=Math.floor(x);tx<Math.ceil(x+w);tx++) for(let ty=Math.floor(y);ty<Math.ceil(y+d);ty++){
    if(!inB(tx,ty)) continue;
    const ox=Math.min(tx+1,x+w)-Math.max(tx,x), oy=Math.min(ty+1,y+d)-Math.max(ty,y);
    if(ox>thx && oy>thy) g[tx][ty]=true; }
}
function itemBox(fp,h){
  const [x,y,w,d]=fp;
  return [P(G,x,y+d)[0], P(G,x+w,y)[0], P(G,x,y,h)[1], P(G,x+w,y+d)[1]];
}

function buildWorldSVG(){
  let floors='', decals='', walls='', layerItems=[], labels='';
  const blocked=Array.from({length:GW},()=>Array(GH).fill(false));
  const people=[];
  ROOMS.forEach((r,i)=>{
    const o=r.o, [c1,c2,cs]=r.floor||['#86A9C9','#7D9FC0','#6F92B4'];
    let f='';
    for(let x=0;x<N;x++) for(let y=0;y<N;y++) f+=poly([P(o,x,y),P(o,x+1,y),P(o,x+1,y+1),P(o,x,y+1)],(x+y)%2?c1:c2,`stroke="${cs}" stroke-width=".6"`);
    f+=`<polygon class="hl" points="${pts([P(o,0,0),P(o,N,0),P(o,N,N),P(o,0,N)])}" fill="rgba(255,213,74,.22)" stroke="#FFD54A" stroke-width="4"/>`;
    floors+=`<g class="room" id="room-${r.id}">${f}</g>`;
    FURN[r.id](o).forEach(t=>{
      if(t.actor){ people.push({...t, x:t.x+r.rx, y:t.y+r.ry, room:i}); return; }
      if(!t.fp){ if(t.floor) decals+=t.s; else walls+=t.s; return; }
      const fp=[t.fp[0]+r.rx,t.fp[1]+r.ry,t.fp[2],t.fp[3]];
      blockFP(blocked,fp);
      layerItems.push({s:t.s,fp,h:t.h||40});
    });
    const [lx,ly]=P(o,.6,.6,r.row===0?62:24); const lw=Math.round(r.name.length*6.3+22);
    labels+=`<g transform="translate(${lx.toFixed(1)},${ly.toFixed(1)})"><rect x="${-lw/2}" y="-10" width="${lw}" height="19" rx="9.5" fill="${r.color}" stroke="${OUT}" stroke-width=".8"/><text y="3.8" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF">${r.name.replace(/&/g,'&amp;')}</text></g>`;
  });
  // vách thấp giữa các phòng (chừa cửa)
  const LOW=18, LC='#E6E1D6', LSK='stroke="#A9A291" stroke-width=".55" stroke-linejoin="round"';
  for(let X=N;X<GW;X+=N) for(let y=0;y<GH;y++){ const l=y%N; if(l===3||l===4) continue; layerItems.push({s:boxS(G,X-.07,y,0,.14,1,LOW,LC,LSK),fp:[X-.07,y,.14,1],h:LOW}); }
  for(let Y=N;Y<GH;Y+=N) for(let x=0;x<GW;x++){ const l=x%N; if(l===3||l===4) continue; layerItems.push({s:boxS(G,x,Y-.07,0,1,.14,LOW,LC,LSK),fp:[x,Y-.07,1,.14],h:LOW}); }
  // cột cửa
  const post=(x,y)=>layerItems.push({s:boxS(G,x-.09,y-.09,0,.18,.18,30,'#CFC8B8',LSK),fp:[x-.09,y-.09,.18,.18],h:30});
  for(let X=N;X<GW;X+=N) for(let r=0;r<ROWS;r++){ post(X,r*N+3); post(X,r*N+5); }
  for(let Y=N;Y<GH;Y+=N) for(let c=0;c<COLS;c++){ post(c*N+3,Y); post(c*N+5,Y); }
  // nền nhà dày + tường ngoài cao (trái và sau), cửa sổ
  let shell=poly([P(G,GW,0),P(G,GW,GH),P(G,GW,GH,-12),P(G,GW,0,-12)],'#55647C')+poly([P(G,0,GH),P(G,GW,GH),P(G,GW,GH,-12),P(G,0,GH,-12)],'#6A7B95');
  shell+=wallL(G,0,GH,0,WH,'#ECE9E1')+wallR(G,0,GW,0,WH,'#DFDBD1');
  for(let r=0;r<ROWS;r++) shell+=wallL(G,r*N,r*N+N,0,7,ROOMS[r*COLS].color)+windowL(G,r*N+.7,r*N+3.8)+windowL(G,r*N+4.2,r*N+7.3);
  for(let c=0;c<COLS;c++) shell+=wallR(G,c*N,c*N+N,0,7,ROOMS[c].color);
  shell+=poly([P(G,0,0,WH),P(G,0,GH,WH),P(G,-.25,GH,WH),P(G,-.25,-.25,WH)],'#BDB8AC')+poly([P(G,0,0,WH),P(G,GW,0,WH),P(G,GW,-.25,WH),P(G,-.25,-.25,WH)],'#C9C4B8');
  shell+=poly([P(G,0,GH,0),P(G,-.25,GH,0),P(G,-.25,GH,WH),P(G,0,GH,WH)],'#CFCABE')+poly([P(G,GW,0,0),P(G,GW,-.25,0),P(G,GW,-.25,WH),P(G,GW,0,WH)],'#CFCABE');
  shell+=wallText(G,GW-4.2,60,'☁ ĐÁM MÂY',16,'#3D6FD9');
  layerItems.sort((a,b)=>(a.fp[0]+a.fp[2]/2+a.fp[1]+a.fp[3]/2)-(b.fp[0]+b.fp[2]/2+b.fp[1]+b.fp[3]/2));
  layerItems.forEach(it=>it.box=itemBox(it.fp,it.h));
  WORLD.blocked=blocked; WORLD.items=layerItems; WORLD.people=people;
  return `<svg width="${SCENE_W}" height="${SCENE_H}" viewBox="0 0 ${SCENE_W} ${SCENE_H}" role="img" aria-label="Tầng văn phòng Đám Mây gồm ${ROOMS.map(r=>r.name).join(', ')}">`
    +`<g>${shell}${floors}${decals}${walls}<polygon class="marker" points="0,0" fill="rgba(255,255,255,.45)" stroke="#FFD54A" stroke-width="2"/></g>`
    +`<g class="layer">${layerItems.map(it=>`<g>${it.s}</g>`).join('')}</g>`
    +`<g class="labels" pointer-events="none">${labels}</g></svg>`;
}

/* ---- actor ---- */
function makeActor(x,y,look,kind,extra=''){
  const g=document.createElementNS(SVGNS,'g'); g.setAttribute('class','actor');
  g.innerHTML=personSVG(0,0,look)+extra;
  WORLD.layer.appendChild(g);
  const a={x:x+.5,y:y+.5,el:g,kind,path:[],seg:null,speed:kind==='player'?3.2:1.2,curSpeed:1,idle:1+Math.random()*4,home:[x,y],waiters:[],phase:Math.random()*6};
  a.room=a.homeRoom=roomAt(x,y);
  actors.push(a); placeActor(a); return a;
}
function placeActor(a){
  const [sx,sy]=P(G,a.x,a.y);
  const bob=a.seg?-Math.abs(Math.sin(a.phase*9))*1.8:0;
  a.el.setAttribute('transform',`translate(${sx.toFixed(1)},${(sy+bob).toFixed(1)})`);
}
function reorder(){
  const list=WORLD.items, slots={};
  const acts=actors.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  for(const a of acts){
    const [sx,sy]=P(G,a.x,a.y); let idx=0;
    for(let k=0;k<list.length;k++){ const it=list[k], b=it.box;
      if(b[1]<sx-12||b[0]>sx+12||b[3]<sy-62||b[2]>sy+4) continue;
      const [x,y,w,d]=it.fp; if(a.x>=x+w-.02 || a.y>=y+d-.02) idx=k+1; }
    (slots[idx]=slots[idx]||[]).push(a.el);
  }
  const order=[];
  for(let k=0;k<=list.length;k++){ if(slots[k]) order.push(...slots[k]); if(k<list.length) order.push(list[k].el); }
  const ch=WORLD.layer.childNodes; let same=ch.length===order.length;
  if(same) for(let k=0;k<order.length;k++) if(ch[k]!==order[k]){ same=false; break; }
  if(!same) order.forEach(e=>WORLD.layer.appendChild(e));
}

/* ---- tìm đường ---- */
function bfs(sx,sy,ex,ey){
  if(sx===ex&&sy===ey) return [];
  const key=(x,y)=>x*GH+y, prev=new Map([[key(sx,sy),null]]), q=[[sx,sy]];
  while(q.length){ const [x,y]=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy;
      if(!walkable(nx,ny)||prev.has(key(nx,ny))||!edgeOpen(x,y,nx,ny)) continue;
      prev.set(key(nx,ny),[x,y]);
      if(nx===ex&&ny===ey){ const path=[[nx,ny]]; let c=[x,y]; while(!(c[0]===sx&&c[1]===sy)){ path.unshift(c); c=prev.get(key(c[0],c[1])); } return path; }
      q.push([nx,ny]); } }
  return null;
}
function nearestFree(tx,ty){
  tx=clamp(tx,0,GW-1); ty=clamp(ty,0,GH-1);
  if(walkable(tx,ty)) return [tx,ty];
  const room=roomAt(tx,ty);
  for(let r=1;r<GW;r++) for(let dx=-r;dx<=r;dx++){ const dy=r-Math.abs(dx);
    for(const yy of [ty+dy,ty-dy]){ const xx=tx+dx; if(walkable(xx,yy)&&roomAt(xx,yy)===room) return [xx,yy]; } }
  return [tx,ty];
}
function currentTile(a){
  if(a.seg) return [Math.floor(a.seg.tx),Math.floor(a.seg.ty)];
  return [clamp(Math.floor(a.x),0,GW-1),clamp(Math.floor(a.y),0,GH-1)];
}
function walkTo(a,tx,ty,{maxTime=6}={}){
  a.waiters.splice(0).forEach(r=>r(false));
  const [cx,cy]=currentTile(a); [tx,ty]=nearestFree(tx,ty);
  const p=bfs(cx,cy,tx,ty);
  if(!p) return Promise.resolve(false);
  const wps=p.map(([x,y])=>({x:x+.5,y:y+.5}));
  let len=0, px=a.seg?a.seg.tx:a.x, py=a.seg?a.seg.ty:a.y;
  for(const w of wps){ len+=Math.hypot(w.x-px,w.y-py); px=w.x; py=w.y; }
  a.curSpeed=Math.max(a.speed,len/maxTime);
  a.path=wps;
  return new Promise(r=>a.waiters.push(r));
}
function walkToRoom(id,[lx,ly],opts){ const r=ROOMS[roomIndex(id)]; followCam=true; return Promise.race([walkTo(player,r.rx+lx,r.ry+ly,opts||{maxTime:2.5}),sleep(4500)]); }
function wanderPick(a){
  const taken=new Set();
  actors.forEach(b=>{ if(b===a) return; taken.add(Math.floor(b.x)*GH+Math.floor(b.y));
    const last=b.path[b.path.length-1]; if(last) taken.add(Math.floor(last.x)*GH+Math.floor(last.y)); });
  const [cx,cy]=currentTile(a), [hx,hy]=a.home, cand=[];
  const r=ROOMS[a.homeRoom];
  for(let x=r.rx;x<r.rx+N;x++) for(let y=r.ry;y<r.ry+N;y++)
    if(walkable(x,y) && !taken.has(x*GH+y) && Math.abs(x-hx)+Math.abs(y-hy)<=4 && (x!==cx||y!==cy)) cand.push([x,y]);
  if(!cand.length) return;
  const [x,y]=pick(cand); const p=bfs(cx,cy,x,y);
  if(p && p.length<12){ a.path=p.map(([x,y])=>({x:x+.5,y:y+.5})); a.curSpeed=a.speed; }
}
function updateActor(a,dt){
  if(!a.seg){
    if(a.path.length){ const wp=a.path.shift(); a.seg={fx:a.x,fy:a.y,tx:wp.x,ty:wp.y,t:0,len:Math.max(.001,Math.hypot(wp.x-a.x,wp.y-a.y))}; }
    else {
      if(a.waiters.length) a.waiters.splice(0).forEach(r=>r(true));
      if(a.kind==='wander' && !a.talking){ a.idle-=dt; if(a.idle<=0){ wanderPick(a); a.idle=a.gossip?1+Math.random()*2.5:2+Math.random()*5; } }
      return false;
    }
  }
  const s=a.seg; s.t=Math.min(1,s.t+dt*a.curSpeed/s.len);
  a.x=s.fx+(s.tx-s.fx)*s.t; a.y=s.fy+(s.ty-s.fy)*s.t; a.phase+=dt;
  if(s.t>=1) a.seg=null;
  a.room=roomAt(Math.floor(a.x),Math.floor(a.y));
  placeActor(a);
  return true;
}
function bubbleTick(dt){
  bubbleT-=dt; if(bubbleT>0) return; bubbleT=.7+Math.random()*1.2;
  const g=actors.filter(a=>a.gossip&&!a.bubbleOn); if(!g.length || actors.filter(a=>a.bubbleOn).length>=3) return;
  const a=pick(g), b=a.el.querySelector('.bubble'); if(!b) return;
  let line; do{ line=pick(a.lines||GOSSIP_LINES); }while(line===a.lastLine && (a.lines||GOSSIP_LINES).length>1); a.lastLine=line;
  const w=Math.round(line.length*4.7+16);
  b.querySelector('.bt').textContent=line; const rect=b.querySelector('.bb'); rect.setAttribute('x',-w/2); rect.setAttribute('width',w);
  b.setAttribute('opacity','1'); a.bubbleOn=true;
  setTimeout(()=>{ b.setAttribute('opacity','0'); a.bubbleOn=false; },3000+Math.min(1500,line.length*40));
}
let lastT=0;
function frame(now){
  const dt=lastT?Math.min(.05,(now-lastT)/1000):0; lastT=now;
  let moved=false;
  for(const a of actors) if(updateActor(a,dt)) moved=true;
  if(moved) reorder();
  bubbleTick(dt);
  updateCamera(dt);
  requestAnimationFrame(frame);
}

/* ---- điều khiển người chơi ---- */
function showMarker(x,y){
  const m=WORLD.marker;
  m.setAttribute('points',pts([P(G,x,y),P(G,x+1,y),P(G,x+1,y+1),P(G,x,y+1)]));
  m.classList.add('on'); clearTimeout(m._t); m._t=setTimeout(()=>m.classList.remove('on'),900);
}
function stepPlayer(dx,dy){
  if(player.seg||player.path.length) return;
  const [x,y]=currentTile(player); followCam=true; player.curSpeed=player.speed;
  const ok1=(ax,ay,bx,by)=>walkable(bx,by)&&edgeOpen(ax,ay,bx,by);
  for(const [a,b] of [[dx,dy],[dx,0],[0,dy]].filter(([a,b])=>a||b)){
    const nx=x+a, ny=y+b;
    if(a&&b){ if(!walkable(nx,ny)) continue; if(!((ok1(x,y,x+a,y)&&ok1(x+a,y,nx,ny))||(ok1(x,y,x,y+b)&&ok1(x,y+b,nx,ny)))) continue; }
    else if(!ok1(x,y,nx,ny)) continue;
    player.path=[{x:nx+.5,y:ny+.5}]; return;
  }
}

/* ---- camera + zoom ---- */
let camX=0, camY=0, camDrag=false, camFree=false, baseScale=1, zoom=1, visTop=0, visH=300, viewRoom=roomIndex('partner');
const ZMIN=.35, ZMAX=2.4;
const roomCenter=i=>{ const r=ROOMS[i]; const [sx,sy]=P(G,r.rx+4,r.ry+4); return [sx,sy-38]; };
function updateCamera(dt){
  if(!camDrag){
    let tx,ty;
    if(followCam && player){ const [sx,sy]=P(G,player.x,player.y); tx=sx; ty=sy-34;
      if(viewRoom!==player.room){ viewRoom=player.room; renderRoomBar(); } }
    else if(camFree){ tx=camX; ty=camY; }
    else [tx,ty]=roomCenter(viewRoom);
    const k=Math.min(1,dt*5); camX+=(tx-camX)*k; camY+=(ty-camY)*k;
  }
  applyCam();
}
function applyCam(){
  const svg=$('office').firstElementChild; if(!svg) return;
  svg.style.transform=`translate(${(window.innerWidth/2-camX*SCALE).toFixed(1)}px,${(visTop+visH/2-camY*SCALE).toFixed(1)}px)`;
}
function setScale(){
  const svg=$('office').firstElementChild; if(!svg) return;
  SCALE=baseScale*zoom;
  svg.classList.toggle('far',SCALE<.62);
  svg.setAttribute('width',Math.round(SCENE_W*SCALE)); svg.setAttribute('height',Math.round(SCENE_H*SCALE));
  $('zoomIn').disabled=zoom>=ZMAX-.01; $('zoomOut').disabled=zoom<=ZMIN+.01;
  $('zoomLbl').textContent=Math.round(zoom*100)+'%';
  applyCam();
}
function setZoom(z){ zoom=clamp(z,ZMIN,ZMAX); setScale(); }
function sizeScene(){
  if(!$('office').firstElementChild) return;
  visTop=document.querySelector('.hud').offsetHeight+6;
  visH=Math.max(160,window.innerHeight-visTop-$('sheet').offsetHeight);
  baseScale=clamp(Math.min(visH/270, window.innerWidth/380),.45,2.2);
  $('navPrev').style.top=$('navNext').style.top=(visTop+visH/2-22)+'px';
  setScale();
}
function hitActor(px,py){
  let best=null;
  for(const a of actors){ if(a.kind==='player') continue;
    const [sx,sy]=P(G,a.x,a.y);
    if(px>=sx-13&&px<=sx+13&&py>=sy-57&&py<=sy+5 && (!best||sy>best.sy)) best={a,sy}; }
  return best&&best.a;
}
function tapFloor(cx,cy){
  const r=$('office').firstElementChild.getBoundingClientRect(); const px=(cx-r.left)/SCALE, py=(cy-r.top)/SCALE;
  const who=hitActor(px,py); if(who){ talkTo(who); return; }
  const [x,y]=invP(G,px,py);
  if(x>=0&&y>=0&&x<GW&&y<GH){ const [fx,fy]=nearestFree(Math.floor(x),Math.floor(y)); showMarker(fx,fy); followCam=true; walkTo(player,fx,fy); }
}
function goRoom(i){ viewRoom=clamp(i,0,ROOMS.length-1); followCam=false; camFree=false; renderRoomBar(); }

function buildOffice(){

  reorder();
  [camX,camY]=roomCenter(viewRoom); followCam=true;
  sizeScene(); window.addEventListener('resize',sizeScene);
  if(window.ResizeObserver) new ResizeObserver(()=>sizeScene()).observe($('sheet'));

  const ptrs=new Map(); let down=null, pinch=null;
  const pdist=()=>{ const [a,b]=[...ptrs.values()]; return Math.hypot(a.x-b.x,a.y-b.y)||1; };
  const [bx0]=P(G,0,GH), [bx1]=P(G,GW,0), by0=OY-WH, by1=P(G,GW,GH)[1];
  o.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  });
  window.addEventListener('pointermove',e=>{

    if(down.moved){ camX=clamp(down.cx-dx/SCALE,bx0,bx1); camY=clamp(down.cy-dy/SCALE,by0,by1); applyCam(); }
  });
  const endPtr=(e,cancel)=>{
    ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
    if(!down) return; const d=down; down=null; o.classList.remove('dragging');
    if(d.moved){ camDrag=false; camFree=true;
      let best=0,bd=1e9; ROOMS.forEach((_,i)=>{ const [rx,ry]=roomCenter(i); const dd=Math.hypot(rx-camX,ry-camY); if(dd<bd){bd=dd;best=i;} });

    if(cancel||busy) return; tapFloor(e.clientX,e.clientY);

  window.addEventListener('keydown',e=>{
    if(busy || document.querySelector('.overlay') || !$('home').hidden) return;
    if(e.target && e.target.closest && e.target.closest('input,textarea,select,button')) return;

    if(!m) return; e.preventDefault(); stepPlayer(...m);
  });
  requestAnimationFrame(frame);
}

    case 'work':   return r<.6?{e:1+rand(2),text:f(T.good)}: r<.9?{e:0,text:f(T.meh)}:{e:-1,text:f(T.bad)};
    case 'gossip': return r<.55?{e:2,text:f(T.good)}:{e:-2,text:f(T.bad)};
    case 'coffee': return r<.7?{e:2,text:f(T.good)}:{e:0,text:f(T.meh)};
    case 'advice': return {e:1,text:`${a.name} khuyên: “${pick(TIPS)}”`};
    case 'report': { const done=S.day.tasks.filter(id=>S.day.done[id]==='ok').length; return r<Math.min(.9,.3+.2*done)?{c:2,text:f(T.good)}:{c:-2,text:f(T.bad)}; }
    case 'strategy': return r<.5?{c:2,text:f(T.good)}:{c:-2,text:f(T.bad)};
    case 'care':   return r<.7?{c:2,text:f(T.good)}:{c:-2,text:f(T.bad)};
    case 'raise':  return r<.3?{c:2,text:f(T.good)}:{c:-2,text:f(T.bad)};
  }
  return {e:0,text:'…'};
}
async function talkTo(a){
  if(busy) return; busy=true;
  try{
    a.talking=true; a.path=[];
    const [nx,ny]=currentTile(a), [px,py]=currentTile(player);
    const spots=[[1,0],[0,1],[-1,0],[0,-1]].map(([dx,dy])=>[nx+dx,ny+dy]).filter(([x,y])=>walkable(x,y)&&edgeOpen(nx,ny,x,y));
    spots.sort((p,q)=>Math.hypot(p[0]-px,p[1]-py)-Math.hypot(q[0]-px,q[1]-py));
    const spot=spots[0]||nearestFree(nx,ny);
    followCam=true;
    await Promise.race([walkTo(player,spot[0],spot[1],{maxTime:3}), sleep(5000)]);
    await openTalk(a);
  } finally { a.talking=false; a.idle=1.5+Math.random()*2; busy=false; render(); }
}
function openTalk(a){
  const talked=S.day.talked && S.day.talked[a.npcId];
  const opts=a.boss?BOSS_OPTS:TALK_OPTS;
  return showModal({ kicker:a.boss?'Sếp tổng Đám Mây':`Phòng ${a.dept}`, title:a.label, actions:[], body:(el,close)=>{
    el.append(h('div',{class:'talk-head'},
      h('div',{class:'talk-face',html:`<svg viewBox="-17 -44 34 40">${personSVG(0,0,a.look)}</svg>`}),
      h('p',{class:'talk-say'},`“${pick(talked?BUSY_HI:(a.boss?BOSS_HI:HI))}”`)));
    const out=h('div',{'aria-live':'polite'}), grid=h('div',{class:'talk-opts'}), foot=h('div',{class:'actions'});
    const bye=()=>{ const b=h('button',{type:'button',class:'btn primary',onclick:()=>close()},'Tạm biệt'); foot.innerHTML=''; foot.append(b); b.focus(); };
    if(talked){ el.append(h('p',{class:'note'},`Hôm nay bạn đã nói chuyện với ${a.name} rồi. Mai quay lại nhé.`),foot); bye(); return; }
    opts.forEach(o=>grid.append(h('button',{type:'button',class:'talk-opt',onclick:()=>{
      const res=rollTalk(a,o.id);
      S.day.talked=S.day.talked||{}; S.day.talked[a.npcId]=true;
      S.energy=clamp(S.energy+(res.e||0),0,MAX_ENERGY);
      if(res.c){ S.coins=Math.max(0,S.coins+res.c); S.earned=Math.max(0,S.earned+res.c); }
      save(); render();
      const fx=[]; if(res.e) fx.push(`${res.e>0?'+':'−'}${Math.abs(res.e)} năng lượng`); if(res.c) fx.push(`${res.c>0?'+':'−'}${Math.abs(res.c)} coin`);
      grid.remove();
      out.append(h('p',{class:'talk-res'},`${o.icon} ${res.text}`), h('p',{class:'note'},fx.length?fx.join(', '):'Không có gì thay đổi.'));
      bye();
    }}, h('span',{class:'em','aria-hidden':'true'},o.icon), h('b',{},o.label), h('small',{},o.hint))));
    foot.append(h('button',{type:'button',class:'btn ghost',onclick:()=>close()},'Để sau'));
    el.append(grid,out,foot);
  }});
}

function playMinigame(t){
  const d=deptOf(t.dept);
  return showModal({
    wide:true, dismissible:false, actions:[],
    kicker:`Phòng ${d.name}, nhiệm vụ ${t.diff==='hard'?'khó':'dễ'}`, title:t.title,
    body:(el,close)=>{
      const tb=h('div',{class:'timer'},h('i')); const tl=h('div',{class:'tlabel'});
      const stage=h('div',{class:'stage'});
      const foot=h('div',{class:'actions'});
      let ended=false, iv=null, left=1, total=1; const cleanups=[];
      const draw=()=>{ const p=Math.max(0,left/total*100); tb.firstChild.style.width=p+'%'; tb.classList.toggle('low',p<30); tl.textContent=`Còn ${Math.ceil(Math.max(0,left))} giây`; };
      const end=r=>{
        if(ended) return; ended=true; clearInterval(iv); cleanups.forEach(f=>f());
        if(r.win){ stage.append(h('div',{class:'winflash'},'✓ Xong!')); setTimeout(()=>close(r), reduced?200:650); }
        else close(r);
      };
      const ctx={
        win:()=>end({win:true}),
        fail:reason=>end({win:false,reason}),
        onCleanup:f=>cleanups.push(f),
        startTimer(sec){ total=left=sec; draw(); iv=setInterval(()=>{ left-=0.25; draw(); if(left<=0) ctx.fail('Hết giờ! Việc chưa xong mà thời gian đã cạn.'); },250); },
        addTime(s){ left=Math.max(0,left+s); draw(); },
        get ended(){ return ended; },
      };
      foot.append(h('button',{type:'button',class:'btn ghost',onclick:()=>ctx.fail('Bạn bỏ ngang nhiệm vụ giữa chừng.')},'Bỏ cuộc'));
      el.append(h('div',{class:'trow'},tb,tl), stage, foot);
      MINIGAMES[t.game](stage, ctx);
    }
  });
}

const MINIGAMES = {

  /* 1. Admin/Legal: đi đúng tuyến, giao đúng người */
  route(root, ctx){
    const W=7, H=6, start={x:0,y:H-1};
    const key=(x,y)=>x+','+y;
    const people=shuffle(PEOPLE).slice(0,3); const target=pick(people);
    const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
    let pp=[], obs=new Map();
    const reachAll=()=>{
      const pset=new Set(pp.map(p=>key(p.x,p.y))); const seen=new Set([key(start.x,start.y)]); const q=[start];
      while(q.length){ const c=q.shift(); for(const [dx,dy] of DIRS){ const nx=c.x+dx, ny=c.y+dy, k=key(nx,ny);
        if(nx<0||ny<0||nx>=W||ny>=H||seen.has(k)||obs.has(k)||pset.has(k)) continue; seen.add(k); q.push({x:nx,y:ny}); } }
      return pp.every(p=>DIRS.some(([dx,dy])=>seen.has(key(p.x+dx,p.y+dy))));
    };
    for(let k=0;k<400;k++){
      const cells=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++) cells.push({x,y});
      const far=shuffle(cells.filter(c=>c.x>=3));
      pp=people.map((p,i)=>({...p,x:far[i].x,y:far[i].y}));
      const taken=new Set([key(0,H-1),key(1,H-1),key(0,H-2),...pp.map(p=>key(p.x,p.y))]);
      obs=new Map(); shuffle(cells.filter(c=>!taken.has(key(c.x,c.y)))).slice(0,11).forEach(c=>obs.set(key(c.x,c.y),pick(['🪴','🗄️','🖨️','📦'])));
      if(reachAll()) break;
    }
    let pos={...start};
    const grid=h('div',{class:'rgrid'});
    const draw=()=>{
      grid.innerHTML='';
      for(let y=0;y<H;y++) for(let x=0;x<W;x++){
        const k=key(x,y); const p=pp.find(q=>q.x===x&&q.y===y);
        let cls='cell', kids=[];
        if(x===pos.x&&y===pos.y){ cls+=' me'; kids=['🧑‍💼']; }
        else if(obs.has(k)){ cls+=' obs'; kids=[obs.get(k)]; }
        else if(p){ cls+=' person'; kids=[p.icon,h('small',{},p.name)]; }
        else if(x===start.x&&y===start.y){ kids=[h('small',{},'Cửa')]; }
        grid.append(h('div',{class:cls,onclick:()=>{ const dx=x-pos.x, dy=y-pos.y; if(Math.abs(dx)+Math.abs(dy)===1) move(dx,dy); }},...kids));
      }
    };
    const move=(dx,dy)=>{
      if(ctx.ended) return;
      const nx=pos.x+dx, ny=pos.y+dy; if(nx<0||ny<0||nx>=W||ny>=H) return;
      if(obs.has(key(nx,ny))) return;
      const p=pp.find(q=>q.x===nx&&q.y===ny);
      if(p){ if(p.name===target.name) ctx.win(); else ctx.fail(`Bạn giao nhầm hồ sơ cho ${p.name} (${p.role}), người cần ký là ${target.role}.`); return; }
      pos={x:nx,y:ny}; draw();
    };
    const onKey=e=>{
      const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
      if(m){ e.preventDefault(); move(...m); }
    };
    window.addEventListener('keydown',onKey); ctx.onCleanup(()=>window.removeEventListener('keydown',onKey));
    const btn=(lbl,dx,dy,aria)=>h('button',{type:'button','aria-label':aria,onclick:()=>move(dx,dy)},lbl);
    const pad=h('div',{class:'dpad'}, h('span'),btn('↑',0,-1,'Lên'),h('span'), btn('←',-1,0,'Trái'),btn('↓',0,1,'Xuống'),btn('→',1,0,'Phải'));
    root.append(
      h('div',{class:'msg'},h('div',{class:'who'},'Sếp CTS & Partnership'),h('div',{html:`Hợp đồng tài trợ cần chữ ký của <b>${target.role}</b>. Đi tới tận bàn và giao đúng người nhé.`})),
      h('div',{class:'route-wrap'},
        grid,
        h('div',{}, h('ul',{class:'legend'},...pp.map(p=>h('li',{},`${p.icon} ${p.name}: ${p.role}`))),
          pad, h('p',{class:'lead',style:'margin-top:8px;font-size:12px'},'Dùng phím mũi tên, nút điều hướng hoặc chạm ô kế bên. Đi vào bàn ai là giao cho người đó.'))));
    draw(); ctx.startTimer(30);
  },

  /* 2. Marketing: chọn đúng banner */
  banner(root, ctx){
    const SH=[{k:'wide',label:'ngang 16:9'},{k:'square',label:'vuông 1:1'},{k:'tall',label:'dọc 9:16'}];
    const CO=[{label:'xanh dương',c:'#3D6FD9',ink:'#fff'},{label:'đỏ',c:'#D9443F',ink:'#fff'},{label:'vàng',c:'#F2C230',ink:'#2A2100'},{label:'xanh lá',c:'#2E9C63',ink:'#fff'}];

      if(!v.logo) d.push('thiếu logo công ty'); return d.join(', '); };
    root.append(h('div',{class:'msg'},h('div',{class:'who'},'Chị Trang, phòng Marketing'),
      h('div',{html:`Em lấy giúp chị banner <b>“${TI[want.t]}”</b>, khổ <b>${SH[want.s].label}</b>, tông <b>${CO[want.c].label}</b>, nhớ có <b>logo Đám Mây</b> nha.`})));
    const grid=h('div',{class:'banners'});
    shuffle(opts).forEach(v=>{
      const co=CO[v.c];
      const bn=h('div',{class:`bn ${SH[v.s].k}`,style:`background:${co.c};color:${co.ink}`},h('span',{},TI[v.t]), v.logo?h('span',{class:'logo'},'☁ Đám Mây'):h('span'));
      grid.append(h('button',{type:'button',class:'bn-card','aria-label':`Banner ${TI[v.t]}, ${SH[v.s].label}, ${co.label}${v.logo?', có logo':', không logo'}`,
        onclick:()=>{ if(v===want) ctx.win(); else ctx.fail(`Banner bạn mang về bị sai: ${diffText(v)}.`); }},bn));
    });
    root.append(grid); ctx.startTimer(20);
  },

  /* 3. Product: nhập liệu đúng ô */
  data(root, ctx){
    const fmt=n=>n.toLocaleString('vi-VN');
    const gens={
      dau:()=>fmt((800+rand(1200))*100),
      dl:()=>fmt((100+rand(500))*100),
      rev:()=>((12+rand(37))/10).toFixed(1).replace('.',',')+' tỷ',
      ret:()=>(30+rand(26))+'%',
    };
    const M=[{k:'dau',label:'Người chơi hoạt động mỗi ngày (DAU)'},{k:'dl',label:'Lượt tải mới'},{k:'rev',label:'Doanh thu'},{k:'ret',label:'Giữ chân ngày 1 (D1)'}];
    M.forEach(m=>{ m.now=gens[m.k](); do{ m.prev=gens[m.k](); }while(m.prev===m.now); });
    const decoys=shuffle(M).slice(0,2);
    const chips=shuffle([...M.map(m=>({v:m.now})), ...decoys.map(m=>({v:m.prev}))]);
    root.append(h('div',{class:'msg'},h('div',{class:'who'},'Anh Phúc, phòng Product'),
      h('div',{html:`Số liệu tháng này nè em:<br>${M.map(m=>`${m.label}: <b>${m.now}</b>`).join('<br>')}<br><span style="color:var(--muted)">Tháng trước để em tham khảo: ${decoys.map(m=>`${m.label} ${m.prev}`).join(', ')}.</span>`})));
    root.append(h('p',{style:'font-size:13px;color:var(--muted);margin:0'},'Chọn một con số, rồi chạm vào ô cần điền. Chạm ô đã điền để xoá.'));
    const chipBox=h('div',{class:'chips'});
    let sel=null; const filled={};
    const table=h('table',{class:'rtable'}); const err=h('div',{class:'inline-err','aria-live':'polite'});
    const draw=()=>{
      chipBox.innerHTML='';
      chips.forEach((c,i)=>{ const used=Object.values(filled).includes(i);
        chipBox.append(h('button',{type:'button',class:'chip'+(sel===i?' sel':'')+(used?' used':''),onclick:()=>{ sel = sel===i?null:i; draw(); }},c.v)); });
      table.innerHTML='';
      M.forEach(m=>{ const fi=filled[m.k];
        table.append(h('tr',{},h('td',{},m.label),h('td',{style:'width:44%'},
          h('button',{type:'button',class:fi!=null?'filled':'',onclick:()=>{
            if(sel!=null){ for(const k in filled) if(filled[k]===sel) delete filled[k]; filled[m.k]=sel; sel=null; }
            else if(fi!=null) delete filled[m.k];
            err.textContent=''; draw(); }}, fi!=null?chips[fi].v:'Chạm để điền')))); });
    };
    const submit=h('button',{type:'button',class:'btn primary',onclick:()=>{
      const empty=M.filter(m=>filled[m.k]==null);
      if(empty.length){ err.textContent=`Còn ${empty.length} ô chưa điền.`; return; }
      const wrong=M.find(m=>chips[filled[m.k]].v!==m.now);
      if(wrong) ctx.fail(`Ô “${wrong.label}” bị điền ${chips[filled[wrong.k]].v}, đúng ra phải là ${wrong.now}.`); else ctx.win();
    }},'Nộp báo cáo');
    root.append(chipBox, table, err, h('div',{class:'actions',style:'margin-top:4px'},submit));
    draw(); ctx.startTimer(45);
  },

  /* 4. HR: kiểm tra hồ sơ onboarding CTV */
  hr(root, ctx){
    const names=['Nguyễn Minh Anh','Trần Gia Huy','Lê Thảo Vy','Phạm Quốc Bảo','Võ Ngọc Hân'];
    const name=pick(names); const other=pick(names.filter(n=>n!==name));
    const items=[
      { check:'CCCD còn hạn', ok:['CCCD',`${name}, hạn đến 2031`], bad:['CCCD',`${name}, hết hạn 03/2024`] },
      { check:'Hợp đồng CTV đủ chữ ký hai bên', ok:['Hợp đồng cộng tác viên','Đã ký: CTV và công ty'], bad:['Hợp đồng cộng tác viên','Đã ký: CTV, còn trống chữ ký công ty'] },
      { check:'Ảnh thẻ 3x4', ok:['Ảnh thẻ','3x4, nền trắng'], bad:['Ảnh thẻ','4x6, ảnh selfie'] },
      { check:'Tài khoản ngân hàng đúng tên CTV', ok:['Thông tin tài khoản',`Chủ TK: ${name.toUpperCase()}`], bad:['Thông tin tài khoản',`Chủ TK: ${other.toUpperCase()}`] },
      { check:'Cam kết bảo mật đã ký', ok:['Cam kết bảo mật (NDA)','Đã ký, có ghi ngày'], bad:['Cam kết bảo mật (NDA)','Chưa ký'] },
    ];
    const badPicks=shuffle(items).slice(0,3);
    const docs=shuffle([
      ...items.map(it=>({t:it.ok[0],d:it.ok[1],valid:true,check:it.check})),
      ...badPicks.map(it=>({t:it.bad[0],d:it.bad[1],valid:false})),
      {t:'Bảng điểm đại học',d:'Không có trong checklist',valid:false},
    ]);
    const selected=new Set();
    const list=h('div',{class:'docs'});
    const draw=()=>{ list.innerHTML=''; docs.forEach((doc,i)=>list.append(h('button',{type:'button',class:'doc'+(selected.has(i)?' sel':''),'aria-pressed':String(selected.has(i)),
      onclick:()=>{ selected.has(i)?selected.delete(i):selected.add(i); draw(); }},h('b',{},(selected.has(i)?'✓ ':'')+doc.t),h('span',{},doc.d)))); };
    const err=h('div',{class:'inline-err'});
    root.append(
      h('div',{class:'msg'},h('div',{class:'who'},'Chị Ngân, phòng HR'),h('div',{html:`Hồ sơ CTV <b>${name}</b> đây em. Chọn đúng giấy tờ hợp lệ theo checklist rồi nộp cho chị, giấy nào lỗi thì để lại.`})),
      h('div',{class:'hr-wrap'}, h('ul',{class:'checklist'},h('li',{},h('b',{},'Checklist onboarding')),...items.map(it=>h('li',{},'☐ '+it.check))), list),
      err,
      h('div',{class:'actions'},h('button',{type:'button',class:'btn primary',onclick:()=>{
        const chosen=[...selected].map(i=>docs[i]);
        const badOne=chosen.find(d=>!d.valid);
        if(badOne) return ctx.fail(`Bạn nộp kèm “${badOne.t}” không hợp lệ (${badOne.d}). HR trả hồ sơ về.`);
        const missing=docs.find(d=>d.valid && !chosen.includes(d));
        if(missing) return ctx.fail(`Hồ sơ còn thiếu: ${missing.check}.`);
        ctx.win();
      }},'Nộp hồ sơ cho HR')));
    draw(); ctx.startTimer(50);
  },

  /* 5. Partnership: phân loại inbox */
  inbox(root, ctx){
    const byCat=c=>shuffle(EMAILS.filter(e=>e.cat===c)).slice(0,2);
    const queue=shuffle(CATS.flatMap(c=>byCat(c.id)));
    let i=0, mistakes=0; const wrongs=[];
    const prog=h('div',{class:'progress'}); const card=h('div',{class:'mail'}); const cats=h('div',{class:'cats'});
    const draw=()=>{ const m=queue[i];
      prog.textContent=`Email ${i+1}/${queue.length}. Được sai tối đa 1 email.${mistakes?` Đã sai ${mistakes}.`:''}`;
      card.className='mail'; card.innerHTML='';
      card.append(h('div',{class:'from'},`Từ: ${m.from}`),h('h3',{},m.subj),h('div',{},m.body)); };
    const answer=cid=>{
      if(ctx.ended) return;
      const m=queue[i];
      if(cid!==m.cat){ mistakes++; wrongs.push(m); card.classList.add('flash-bad','shake'); }
      else card.classList.add('flash-ok');
      if(mistakes>=2){ const lbl=c=>CATS.find(x=>x.id===c).label; return ctx.fail(`Bạn phân loại sai 2 email, ví dụ “${wrongs[1].subj}” đúng ra là ${lbl(wrongs[1].cat)}.`); }
      setTimeout(()=>{ if(ctx.ended) return; i++; if(i>=queue.length) ctx.win(); else draw(); }, reduced?60:280);
    };
    CATS.forEach((c,n)=>cats.append(h('button',{type:'button',onclick:()=>answer(c.id)},`${n+1}. ${c.label}`,h('small',{},c.hint))));
    const onKey=e=>{ const n=parseInt(e.key,10); if(n>=1&&n<=4){ e.preventDefault(); answer(CATS[n-1].id); } };
    window.addEventListener('keydown',onKey); ctx.onCleanup(()=>window.removeEventListener('keydown',onKey));
    root.append(prog,card,cats); draw(); ctx.startTimer(45);
  },

  /* 6. GS: gom đúng 5 tài liệu trong 60 giây (khó) */
  gather(root, ctx){
    const BASE=['Agenda họp liên phòng','Lịch phát hành Q1','Báo cáo doanh thu tháng 10','Danh sách đối tác tiềm năng','Ngân sách sự kiện Tết','Kết quả khảo sát game thủ','Kế hoạch truyền thông Q1','Biên bản họp tuần trước'];
    const WRONG=['(bản nháp)','(bản cũ 2025)','(chưa duyệt)'];
    const FUN=['Menu cơm trưa tuần này','Thiệp mời sinh nhật sếp','Hướng dẫn dùng máy in','Danh sách đặt trà sữa'];
    const needBase=shuffle(BASE).slice(0,5);
    const need=needBase.map(b=>`${b} (bản cuối)`);
    const pileDocs=[...need];
    needBase.forEach(b=>shuffle(WRONG).slice(0,1+rand(2)).forEach(w=>pileDocs.push(`${b} ${w}`)));
    BASE.filter(b=>!needBase.includes(b)).forEach(b=>pileDocs.push(`${b} (bản cuối)`));
    FUN.forEach(f=>pileDocs.push(f));
    const docs=shuffle(pileDocs).slice(0,20);
    need.forEach(n=>{ if(!docs.includes(n)) docs[rand(docs.length)]=n; });   // đảm bảo đủ 5 tài liệu cần
    const got=new Set();
    const needList=h('ul',{class:'need'}); const err=h('div',{class:'inline-err','aria-live':'polite'});
    const drawNeed=()=>{ needList.innerHTML=''; need.forEach(n=>needList.append(h('li',{class:got.has(n)?'got':''},n))); };
    const pile=h('div',{class:'pile'});
    docs.forEach(name=>{
      const rot=(Math.random()*10-5).toFixed(1);
      const b=h('button',{type:'button',class:'pdoc',style:`transform:rotate(${rot}deg)`,onclick:()=>{
        if(ctx.ended || got.has(name)) return;
        if(need.includes(name)){ got.add(name); b.classList.add('gone'); drawNeed(); err.textContent=''; if(got.size===need.length) ctx.win(); }
        else { ctx.addTime(-5); err.textContent=`Sai tài liệu: “${name}”. Bị trừ 5 giây.`; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
      }},'📄 '+name);
      pile.append(b);
    });
    root.append(
      h('div',{class:'msg'},h('div',{class:'who'},'Anh Dũng, phòng GS'),h('div',{},'Họp liên phòng sắp bắt đầu! Gom giúp anh đúng 5 tài liệu bản cuối này. Lấy nhầm là mất thời gian đó.')),
      needList, err, pile);
    drawNeed(); ctx.startTimer(60);
  },
};

function buildCustomizer(root){
  const prev=h('div',{class:'cz-prev','aria-hidden':'true'}), ctl=h('div',{});

  const seg=(val,cur,label,fn)=>h('button',{type:'button',class:'cz-seg'+(val===cur?' on':''),'aria-pressed':String(val===cur),onclick:()=>change(fn)},label);

    prev.innerHTML=fullSVG(); ctl.innerHTML='';

      row(CZ.gender, seg('male',L.gender,CZ.male,()=>{ L.gender='male'; L.style='short'; L.bottom='pants'; L.tie=true; }), seg('female',L.gender,CZ.female,()=>{ L.gender='female'; L.style='long'; L.bottom='skirt'; L.tie=false; })),

      sws('hair',CZ.hair), sws('skin',CZ.skin), sws('shirt',CZ.shirt),
      row(CZ.bottom, ...['pants','skirt'].map(v=>seg(v,L.bottom,CZ[v],()=>{ L.bottom=v; }))),
      sws('pants',' '),
      row(CZ.tie, seg(true,L.tie,CZ.yes,()=>{ L.tie=true; }), seg(false,L.tie,CZ.no,()=>{ L.tie=false; })),
      h('button',{type:'button',class:'cz-rand',onclick:()=>change(()=>{
        L.gender=pick(['male','female']); L.style=pick(['short','long','bun']); L.bottom=pick(['pants','skirt']); L.tie=Math.random()<.4;
        ['shirt','pants','hair','skin'].forEach(k=>L[k]=pick(SWATCH[k]));
      })},CZ.rand));
  }
  draw();
}
